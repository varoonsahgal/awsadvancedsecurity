# Lab 3.4 - Kyverno ClusterPolicy: every image from the nimbus/* ECR repos must carry a cosign
# signature made with the Skyfortress KMS key. Replace ACCOUNT_ID and paste your public key.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-signed-nimbus-images
  annotations:
    policies.kyverno.io/title: Only signed ships sail
spec:
  validationFailureAction: Enforce
  background: false
  webhookTimeoutSeconds: 30
  rules:
    - name: verify-cosign-kms-signature
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [nimbus]
      verifyImages:
        - imageReferences:
            - "ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/nimbus/*"
          mutateDigest: true          # rewrite tag -> digest so what was verified is what runs
          verifyDigest: true
          required: true
          imageRegistryCredentials:
            helpers: ["amazon"]       # Kyverno uses its own AWS identity (Pod Identity!) to read ECR
          attestors:
            - entries:
                - keys:
                    publicKeys: |-
                      PASTE_OUTPUT_OF_cosign_public-key_HERE
                    rekor: { ignoreTlog: true }
                    ctlog: { ignoreSCT: true }
