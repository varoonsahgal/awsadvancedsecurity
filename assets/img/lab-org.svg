<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Space Grotesk, Inter, sans-serif">
  <title>Skyfortress lab environment: an AWS Organization with Security, Workloads and Forensics OUs</title>
  <defs>
    <linearGradient id="og" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9900"/><stop offset="1" stop-color="#fbbf24"/></linearGradient>
    <linearGradient id="ov" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
    <linearGradient id="oc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="on" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="or" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fb7185"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
    <filter id="ogl" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="640" fill="#070b1c"/>
  <g fill="#fff" opacity=".5"><circle cx="60" cy="40" r="1.4"/><circle cx="1130" cy="70" r="1.6"/><circle cx="900" cy="30" r="1"/><circle cx="300" cy="610" r="1.2"/></g>

  <!-- root -->
  <g transform="translate(600 70)">
    <rect x="-200" y="-40" width="400" height="80" rx="18" fill="#0f1533" stroke="url(#og)" stroke-width="3" filter="url(#ogl)"/>
    <text y="-8" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">Organization root</text>
    <text y="20" text-anchor="middle" font-size="15" fill="#ffc35c">management account · billing + Organizations only</text>
  </g>
  <g fill="#ffc35c" font-size="14" text-anchor="middle">
    <text x="600" y="140">SCPs · RCPs · declarative policies · centralized root access</text>
  </g>
  <!-- connectors -->
  <g stroke="#3b4580" stroke-width="2.5" fill="none">
    <path d="M600 150 V180 H180 V220"/><path d="M600 180 H470 V220"/><path d="M600 180 H760 V220"/><path d="M600 180 H1030 V220"/>
  </g>

  <!-- OU boxes -->
  <g>
    <rect x="40" y="220" width="280" height="390" rx="20" fill="rgba(167,139,250,.08)" stroke="url(#ov)" stroke-width="2"/>
    <text x="180" y="254" text-anchor="middle" font-size="19" font-weight="700" fill="#c4b5fd">OU: Security</text>
    <rect x="345" y="220" width="250" height="390" rx="20" fill="rgba(52,211,153,.07)" stroke="url(#on)" stroke-width="2"/>
    <text x="470" y="254" text-anchor="middle" font-size="19" font-weight="700" fill="#6ee7b7">OU: Workloads</text>
    <rect x="620" y="220" width="280" height="390" rx="20" fill="rgba(34,211,238,.07)" stroke="url(#oc)" stroke-width="2"/>
    <text x="760" y="254" text-anchor="middle" font-size="19" font-weight="700" fill="#67e8f9">OU: Sandbox</text>
    <rect x="925" y="220" width="235" height="390" rx="20" fill="rgba(251,113,133,.08)" stroke="url(#or)" stroke-width="2"/>
    <text x="1042" y="254" text-anchor="middle" font-size="19" font-weight="700" fill="#fda4af">OU: Forensics</text>
  </g>

  <!-- accounts -->
  <g font-size="15">
    <g transform="translate(60 276)">
      <rect width="240" height="140" rx="14" fill="#0f1533" stroke="#4c4f9a"/>
      <text x="16" y="30" font-weight="700" fill="#fff" font-size="17">🛰 security-tooling</text>
      <text x="16" y="56" fill="#b7c0e6">delegated admin for GuardDuty,</text>
      <text x="16" y="76" fill="#b7c0e6">Security Hub, Inspector, Macie,</text>
      <text x="16" y="96" fill="#b7c0e6">Access Analyzer, Detective</text>
      <text x="16" y="124" fill="#a78bfa" font-size="13">optional · Days 2, 5</text>
    </g>
    <g transform="translate(60 440)">
      <rect width="240" height="150" rx="14" fill="#0f1533" stroke="#4c4f9a"/>
      <text x="16" y="30" font-weight="700" fill="#fff" font-size="17">📜 log-archive</text>
      <text x="16" y="56" fill="#b7c0e6">org CloudTrail bucket</text>
      <text x="16" y="76" fill="#b7c0e6">(Object Lock), Security Lake,</text>
      <text x="16" y="96" fill="#b7c0e6">flow logs, Resolver logs</text>
      <text x="16" y="124" fill="#a78bfa" font-size="13">optional · Day 2</text>
    </g>
    <g transform="translate(365 276)">
      <rect width="210" height="150" rx="14" fill="#0f1533" stroke="#34d399" stroke-width="2"/>
      <text x="16" y="30" font-weight="700" fill="#fff" font-size="17">🚀 skyfortress-prod</text>
      <text x="16" y="56" fill="#b7c0e6">"production": GameDay</text>
      <text x="16" y="76" fill="#b7c0e6">environment, data</text>
      <text x="16" y="96" fill="#b7c0e6">perimeter targets</text>
      <text x="16" y="128" fill="#34d399" font-size="13">REQUIRED</text>
    </g>
    <g transform="translate(640 276)">
      <rect width="240" height="150" rx="14" fill="#0f1533" stroke="#22d3ee" stroke-width="2"/>
      <text x="16" y="30" font-weight="700" fill="#fff" font-size="17">🧪 skyfortress-dev</text>
      <text x="16" y="56" fill="#b7c0e6">most labs run here:</text>
      <text x="16" y="76" fill="#b7c0e6">vulnerable stacks, attack</text>
      <text x="16" y="96" fill="#b7c0e6">sims, EKS, Bedrock bots</text>
      <text x="16" y="128" fill="#22d3ee" font-size="13">REQUIRED</text>
    </g>
    <g transform="translate(640 444)">
      <rect width="240" height="146" rx="14" fill="#0f1533" stroke="#4c4f9a" stroke-dasharray="6 6"/>
      <text x="16" y="30" font-weight="700" fill="#fff" font-size="17">🧍 outsider (any acct)</text>
      <text x="16" y="56" fill="#b7c0e6">a principal from outside</text>
      <text x="16" y="76" fill="#b7c0e6">the org, used to test data</text>
      <text x="16" y="96" fill="#b7c0e6">perimeters (a classmate's)</text>
      <text x="16" y="124" fill="#8a95c2" font-size="13">optional · Day 1</text>
    </g>
    <g transform="translate(945 276)">
      <rect width="195" height="200" rx="14" fill="#0f1533" stroke="#fb7185" stroke-width="2"/>
      <text x="16" y="30" font-weight="700" fill="#fff" font-size="17">🔬 forensics</text>
      <text x="16" y="56" fill="#b7c0e6">isolated VPC, no</text>
      <text x="16" y="76" fill="#b7c0e6">internet; evidence</text>
      <text x="16" y="96" fill="#b7c0e6">bucket with Object</text>
      <text x="16" y="116" fill="#b7c0e6">Lock; snapshot</text>
      <text x="16" y="136" fill="#b7c0e6">share target</text>
      <text x="16" y="174" fill="#fb7185" font-size="13">optional · Day 5 (else dev)</text>
    </g>
  </g>
  <text x="1042" y="530" text-anchor="middle" font-size="14" fill="#8a95c2">Budget alarm: $25 / acct</text>
  <text x="1042" y="552" text-anchor="middle" font-size="14" fill="#8a95c2">Region: us-east-1</text>
</svg>
