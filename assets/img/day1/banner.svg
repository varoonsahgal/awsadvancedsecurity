<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
  <title>Keys to the Kingdom: a floating identity citadel guarded by a giant glowing key, with Kraken tentacles rising from the clouds</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05061a"/><stop offset=".45" stop-color="#1a0f45"/><stop offset=".8" stop-color="#3a1460"/><stop offset="1" stop-color="#5b1a5e"/>
    </linearGradient>
    <radialGradient id="moon" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff6e5"/><stop offset=".6" stop-color="#f7d9ff"/><stop offset="1" stop-color="#c4a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity=".55"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aur1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset=".3" stop-color="#22d3ee" stop-opacity=".35"/><stop offset=".6" stop-color="#a78bfa" stop-opacity=".45"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2f7a"/><stop offset="1" stop-color="#140f36"/>
    </linearGradient>
    <linearGradient id="stoneL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1c1648"/><stop offset=".5" stop-color="#3b2f86"/><stop offset="1" stop-color="#1c1648"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe2a3"/><stop offset=".45" stop-color="#ff9900"/><stop offset="1" stop-color="#c25e00"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0"/><stop offset=".5" stop-color="#f472b6" stop-opacity=".45"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c5cc4"/><stop offset="1" stop-color="#2b1658"/>
    </linearGradient>
    <linearGradient id="cloud2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b48ae6"/><stop offset="1" stop-color="#5a2f8f"/>
    </linearGradient>
    <linearGradient id="tent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff4f8b"/><stop offset="1" stop-color="#4a0a2f"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="blur3"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>
  <!-- stars -->
  <g fill="#fff">
    <circle cx="90" cy="70" r="1.6" opacity=".9"/><circle cx="210" cy="160" r="1.1"/><circle cx="330" cy="60" r="2" opacity=".8"/><circle cx="460" cy="190" r="1.2"/>
    <circle cx="560" cy="90" r="1.5"/><circle cx="700" cy="40" r="1.1"/><circle cx="820" cy="130" r="1.8" opacity=".7"/><circle cx="1010" cy="70" r="1.3"/>
    <circle cx="1130" cy="170" r="1"/><circle cx="1250" cy="50" r="2"/><circle cx="1380" cy="150" r="1.2"/><circle cx="1500" cy="80" r="1.6"/>
    <circle cx="1550" cy="240" r="1.1"/><circle cx="150" cy="300" r="1.3"/><circle cx="60" cy="420" r="1"/><circle cx="1470" cy="380" r="1.4"/>
    <circle cx="940" cy="230" r="1"/><circle cx="380" cy="280" r="1"/><circle cx="1320" cy="300" r="1"/><circle cx="640" cy="250" r="1.2"/>
  </g>
  <g fill="#fff" filter="url(#glow)"><circle cx="1250" cy="50" r="2.5"/><circle cx="330" cy="60" r="2.5"/><circle cx="820" cy="130" r="2"/></g>

  <!-- aurora ribbons -->
  <path d="M-50 260 C 300 140, 600 320, 900 200 S 1400 120, 1700 230 L1700 300 C 1400 200, 1100 300, 900 280 S 300 230, -50 340 Z" fill="url(#aur1)" filter="url(#soft)" opacity=".9"/>
  <path d="M-50 360 C 400 260, 700 420, 1100 300 S 1500 280, 1700 340" stroke="url(#aur1)" stroke-width="24" fill="none" filter="url(#soft)" opacity=".7"/>

  <!-- moon / planet -->
  <circle cx="1310" cy="230" r="170" fill="url(#halo)"/>
  <circle cx="1310" cy="230" r="92" fill="url(#moon)"/>
  <ellipse cx="1310" cy="230" rx="170" ry="26" fill="none" stroke="#f472b6" stroke-width="3" opacity=".55" transform="rotate(-14 1310 230)"/>
  <circle cx="300" cy="200" r="34" fill="#6b4fd1" opacity=".55"/><circle cx="290" cy="192" r="34" fill="#8b6cf0" opacity=".4"/>

  <!-- halo behind citadel -->
  <circle cx="800" cy="520" r="330" fill="url(#halo)"/>

  <!-- floating island rock -->
  <path d="M470 660 L1130 660 L1060 730 L980 800 L880 890 L800 940 L720 890 L620 800 L540 730 Z" fill="url(#stone)"/>
  <path d="M540 730 L620 800 L720 890 L800 940 L760 820 L700 740 Z" fill="#0d0a28" opacity=".6"/>
  <g stroke="#a78bfa" stroke-width="2" opacity=".35" fill="none"><path d="M620 700 L700 780 L690 850"/><path d="M980 700 L920 790 L930 840"/></g>

  <!-- citadel -->
  <g>
    <rect x="560" y="420" width="480" height="245" fill="url(#stoneL)"/>
    <!-- crenellations -->
    <path d="M560 420 h480 v-28 h-36 v18 h-32 v-18 h-36 v18 h-32 v-18 h-36 v18 h-32 v-18 h-36 v18 h-32 v-18 h-36 v18 h-32 v-18 h-36 v18 h-32 v-18 h-36 z" fill="#2e2470"/>
    <!-- towers -->
    <rect x="500" y="330" width="100" height="335" fill="#251d5e"/>
    <path d="M490 330 L550 230 L610 330 Z" fill="#3b2f86"/>
    <rect x="1000" y="330" width="100" height="335" fill="#251d5e"/>
    <path d="M990 330 L1050 230 L1110 330 Z" fill="#3b2f86"/>
    <rect x="740" y="270" width="120" height="160" fill="#2e2470"/>
    <path d="M725 272 L800 160 L875 272 Z" fill="#45379b"/>
    <!-- banners -->
    <path d="M550 230 v-50 l40 14 l-40 14" fill="#f472b6"/>
    <path d="M1050 230 v-50 l40 14 l-40 14" fill="#22d3ee"/>
    <path d="M800 160 v-60 l50 16 l-50 16" fill="#ff9900"/>
    <!-- glowing windows -->
    <g fill="#ffd27a" filter="url(#glow)">
      <rect x="535" y="380" width="14" height="26" rx="7"/><rect x="565" y="380" width="14" height="26" rx="7"/>
      <rect x="1035" y="380" width="14" height="26" rx="7"/><rect x="1065" y="380" width="14" height="26" rx="7"/>
      <rect x="785" y="310" width="30" height="44" rx="15"/>
    </g>
    <!-- great vault door -->
    <circle cx="800" cy="560" r="96" fill="#130e33" stroke="url(#gold)" stroke-width="10"/>
    <circle cx="800" cy="560" r="70" fill="none" stroke="#ff9900" stroke-width="3" stroke-dasharray="6 10" opacity=".8"/>
    <g stroke="#ffb347" stroke-width="6" stroke-linecap="round" opacity=".9">
      <line x1="800" y1="474" x2="800" y2="500"/><line x1="800" y1="620" x2="800" y2="646"/><line x1="714" y1="560" x2="740" y2="560"/><line x1="860" y1="560" x2="886" y2="560"/>
    </g>
    <!-- keyhole -->
    <circle cx="800" cy="545" r="20" fill="#f472b6" filter="url(#glow)"/>
    <path d="M790 555 L810 555 L818 600 L782 600 Z" fill="#f472b6" filter="url(#glow)"/>
  </g>

  <!-- the giant key hovering -->
  <g transform="translate(1110 470) rotate(-28)" filter="url(#glow)">
    <circle cx="0" cy="0" r="58" fill="none" stroke="url(#gold)" stroke-width="20"/>
    <circle cx="0" cy="0" r="22" fill="none" stroke="#ffe2a3" stroke-width="4" opacity=".8"/>
    <rect x="50" y="-12" width="230" height="24" rx="10" fill="url(#gold)"/>
    <rect x="210" y="10" width="20" height="44" rx="4" fill="url(#gold)"/>
    <rect x="248" y="10" width="20" height="30" rx="4" fill="url(#gold)"/>
    <text x="110" y="6" font-family="JetBrains Mono, monospace" font-size="15" fill="#5a2a00" font-weight="700">sts:AssumeRole</text>
  </g>
  <!-- light beam from keyhole -->
  <path d="M770 600 L830 600 L980 1000 L620 1000 Z" fill="url(#beam)" opacity=".6"/>

  <!-- policy glyph shards orbiting -->
  <g font-family="JetBrains Mono, monospace" font-size="20" fill="#c9b8ff" opacity=".85">
    <text x="300" y="470">"Effect": "Deny"</text>
    <text x="1180" y="640">"aws:PrincipalOrgID"</text>
    <text x="260" y="600" fill="#f9a8d4">iam:PassRole</text>
    <text x="1040" y="300" fill="#7dd3fc">"Condition": {…}</text>
  </g>
  <g stroke="#a78bfa" stroke-width="2" fill="none" opacity=".4">
    <ellipse cx="800" cy="520" rx="560" ry="120" transform="rotate(-6 800 520)" stroke-dasharray="4 14"/>
  </g>

  <!-- Kraken tentacles rising from the clouds -->
  <g fill="none" stroke="url(#tent)" stroke-linecap="round">
    <path d="M120 1020 C 140 860, 60 780, 150 690 C 210 630, 280 680, 240 740" stroke-width="44"/>
    <path d="M1480 1020 C 1460 870, 1560 800, 1470 700 C 1410 640, 1340 690, 1380 750" stroke-width="44"/>
    <path d="M330 1030 C 360 930, 300 880, 360 820" stroke-width="26"/>
  </g>
  <g fill="#ffb3cb" opacity=".6">
    <circle cx="140" cy="860" r="6"/><circle cx="128" cy="900" r="6"/><circle cx="152" cy="780" r="5"/>
    <circle cx="1466" cy="860" r="6"/><circle cx="1478" cy="900" r="6"/><circle cx="1452" cy="780" r="5"/>
  </g>

  <!-- cloud sea -->
  <g>
    <path d="M-20 860 C 80 800, 180 820, 240 850 C 320 790, 450 800, 520 860 C 600 820, 700 830, 760 880 C 860 820, 980 830, 1040 870 C 1120 810, 1260 820, 1320 860 C 1400 810, 1520 820, 1620 860 L1620 1000 L-20 1000 Z" fill="url(#cloud)" opacity=".95"/>
    <path d="M-20 920 C 100 870, 220 890, 300 920 C 400 870, 520 880, 600 930 C 720 880, 840 890, 920 935 C 1040 885, 1160 890, 1240 930 C 1340 880, 1480 890, 1620 930 L1620 1000 L-20 1000 Z" fill="url(#cloud2)" opacity=".55"/>
  </g>

  <!-- title tag -->
  <g font-family="Space Grotesk, Inter, sans-serif">
    <rect x="60" y="60" width="330" height="44" rx="22" fill="#0b0726" opacity=".7" stroke="#a78bfa" stroke-opacity=".6"/>
    <text x="84" y="89" font-size="18" fill="#e9e1ff" letter-spacing="4">DAY 01 · IDENTITY</text>
  </g>
</svg>
