<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" font-family="Space Grotesk, Inter, sans-serif">
  <title>Effective permissions are the intersection of identity policy, permissions boundary and session policy, minus any explicit deny</title>
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0e0b2c"/><stop offset="1" stop-color="#070b1c"/></linearGradient>
    <filter id="ag" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="12" stroke="#fb7185" stroke-width="4" opacity=".7"/></pattern>
  </defs>
  <rect width="1400" height="700" fill="url(#abg)"/>
  <text x="50" y="58" font-size="28" font-weight="700" fill="#fff">The Arena rule: effective = identity ∩ boundary ∩ session − deny</text>
  <text x="50" y="88" font-size="16" fill="#8a95c2">For SkyfortressArenaContestant, round by round.</text>

  <g style="mix-blend-mode:screen">
    <circle cx="520" cy="380" r="220" fill="#a78bfa" fill-opacity=".28" stroke="#a78bfa" stroke-width="3"/>
    <circle cx="760" cy="380" r="220" fill="#22d3ee" fill-opacity=".22" stroke="#22d3ee" stroke-width="3"/>
    <circle cx="640" cy="520" r="130" fill="#f472b6" fill-opacity=".25" stroke="#f472b6" stroke-width="3" stroke-dasharray="10 7"/>
  </g>
  <!-- explicit deny wedge -->
  <circle cx="660" cy="300" r="52" fill="url(#hatch)" stroke="#fb7185" stroke-width="3" filter="url(#ag)"/>

  <g font-size="18" font-weight="700">
    <text x="330" y="230" fill="#c4b5fd">Identity policy</text>
    <text x="330" y="254" font-size="14" font-weight="400" fill="#c4b5fd" font-family="JetBrains Mono, monospace">s3:* · ssm:GetParameter*</text>
    <text x="820" y="230" fill="#67e8f9">Permissions boundary</text>
    <text x="820" y="254" font-size="14" font-weight="400" fill="#67e8f9" font-family="JetBrains Mono, monospace">s3:Get* List* Delete · ssm:Get*</text>
    <text x="560" y="676" fill="#f9a8d4">Session policy (round 4)</text>
  </g>
  <text x="660" y="296" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">Explicit</text>
  <text x="660" y="314" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">deny</text>
  <text x="640" y="410" font-size="17" fill="#fff" text-anchor="middle" font-weight="700">✓ GetObject</text>
  <text x="640" y="434" font-size="14" fill="#e8ecff" text-anchor="middle">effective</text>
  <text x="420" y="420" font-size="16" fill="#e8ecff" text-anchor="middle">✗ PutObject</text>
  <text x="420" y="442" font-size="13" fill="#8a95c2" text-anchor="middle">outside boundary</text>

  <!-- scoreboard -->
  <g font-family="JetBrains Mono, monospace" font-size="15">
    <rect x="1040" y="290" width="320" height="330" rx="18" fill="#10153a" stroke="#a78bfa" stroke-opacity=".5"/>
    <text x="1062" y="324" fill="#a78bfa">ROUND  ACTION       RESULT</text>
    <text x="1062" y="362" fill="#e8ecff">R1     GetObject    <tspan fill="#34d399">ALLOW</tspan></text>
    <text x="1062" y="396" fill="#e8ecff">R2     PutObject    <tspan fill="#fb7185">DENY·i</tspan></text>
    <text x="1062" y="430" fill="#e8ecff">R3     DeleteObj    <tspan fill="#fb7185">DENY·x</tspan></text>
    <text x="1062" y="464" fill="#e8ecff">R4     Get+session  <tspan fill="#fb7185">DENY·i</tspan></text>
    <text x="1062" y="498" fill="#e8ecff">R5a    GetParam     <tspan fill="#fb7185">DENY·i</tspan></text>
    <text x="1062" y="532" fill="#e8ecff">R5b    +clearance   <tspan fill="#34d399">ALLOW</tspan></text>
    <text x="1062" y="580" fill="#8a95c2" font-size="13">i = implicit   x = explicit</text>
  </g>
</svg>
