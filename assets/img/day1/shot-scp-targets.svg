<text x="300" y="642" font-family="Space Grotesk, Inter, sans-serif" font-size="15" font-weight="700" fill="#fbbf24">Remember</text>
<text x="300" y="670" font-family="Space Grotesk, Inter, sans-serif" font-size="14" fill="#fde68a">SCPs stack: a request must be allowed by every SCP from the root down to the account, and any matching Deny ends it.</text>
<text x="300" y="694" font-family="Space Grotesk, Inter, sans-serif" font-size="14" fill="#fde68a">The management account is never affected — which is why you can always detach a bad policy from there.</text>

