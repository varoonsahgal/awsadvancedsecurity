  <text x="344" y="426"><tspan fill="#93c5fd">"Principal"</tspan><tspan fill="#a5b4fc">: { </tspan><tspan fill="#93c5fd">"AWS"</tspan><tspan fill="#a5b4fc">:</tspan></text>
