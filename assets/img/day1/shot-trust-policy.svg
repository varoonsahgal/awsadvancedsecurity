<rect x="336" y="552" width="420" height="30" rx="6" fill="none" stroke="#fb7185" stroke-width="2.5" stroke-dasharray="7 5"/>
<path d="M756 567 L1010 567" stroke="#fb7185" stroke-width="2.5"/>
<rect x="1010" y="500" width="360" height="190" rx="12" fill="#2a0f1c" stroke="#fb7185"/>
<text x="1030" y="534" font-family="Space Grotesk, Inter, sans-serif" font-size="16" font-weight="700" fill="#fda4af">Missing: Condition</text>
<text x="1030" y="564" font-family="Space Grotesk, Inter, sans-serif" font-size="14" fill="#ffe4e6">No sts:ExternalId check. Whatever</text>
<text x="1030" y="588" font-family="Space Grotesk, Inter, sans-serif" font-size="14" fill="#ffe4e6">ExternalId the vendor sends — any</text>
<text x="1030" y="612" font-family="Space Grotesk, Inter, sans-serif" font-size="14" fill="#ffe4e6">tenant's — is accepted.</text>
<text x="1030" y="650" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12" fill="#fda4af">"StringEquals": {"sts:ExternalId": …}</text>

