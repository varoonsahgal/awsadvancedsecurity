<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 420">
  <title>The four acts of the GameDay: Detect, Contain, Eradicate and Recover, Harden</title>
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#110a26"/><stop offset="1" stop-color="#08081a"/></linearGradient>
    <filter id="ag" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1400" height="420" fill="url(#abg)"/>
  <path d="M175 200 H1225" stroke="#2b2a52" stroke-width="4" stroke-dasharray="2 14" stroke-linecap="round"/>
  <g font-family="Space Grotesk, Inter, sans-serif" text-anchor="middle">
    <!-- Act I -->
    <g transform="translate(175 190)">
      <path d="M0 -120 L96 -84 V-10 C96 54 50 92 0 112 C-50 92 -96 54 -96 -10 V-84 Z" fill="#06202e" stroke="#22d3ee" stroke-width="4" filter="url(#ag)"/>
      <path d="M-56 -20 Q0 -74 56 -20 Q0 34 -56 -20 Z" fill="none" stroke="#a5f3fc" stroke-width="6"/>
      <circle cy="-20" r="18" fill="#22d3ee"/><circle cy="-20" r="7" fill="#06202e"/>
      <text y="56" font-size="20" font-weight="700" fill="#67e8f9">ACT I</text>
      <text y="168" font-size="22" font-weight="700" fill="#fff">Detect</text>
      <text y="194" font-size="15" fill="#8a95c2">find every tentacle</text>
    </g>
    <!-- Act II -->
    <g transform="translate(525 190)">
      <path d="M0 -120 L96 -84 V-10 C96 54 50 92 0 112 C-50 92 -96 54 -96 -10 V-84 Z" fill="#062417" stroke="#34d399" stroke-width="4" filter="url(#ag)"/>
      <rect x="-34" y="-36" width="68" height="54" rx="10" fill="#34d399"/>
      <path d="M-22 -36 v-18 a22 22 0 0 1 44 0 v18" stroke="#34d399" stroke-width="10" fill="none"/>
      <circle cy="-14" r="8" fill="#062417"/><rect x="-3" y="-12" width="6" height="16" fill="#062417"/>
      <text y="56" font-size="20" font-weight="700" fill="#6ee7b7">ACT II</text>
      <text y="168" font-size="22" font-weight="700" fill="#fff">Contain</text>
      <text y="194" font-size="15" fill="#8a95c2">capture, then cut</text>
    </g>
    <!-- Act III -->
    <g transform="translate(875 190)">
      <path d="M0 -120 L96 -84 V-10 C96 54 50 92 0 112 C-50 92 -96 54 -96 -10 V-84 Z" fill="#2a1606" stroke="#ff9900" stroke-width="4" filter="url(#ag)"/>
      <path d="M-34 -10 a36 36 0 0 1 60 -30" stroke="#ffc06b" stroke-width="9" fill="none" stroke-linecap="round"/>
      <path d="M34 -30 a36 36 0 0 1 -60 30" stroke="#ffc06b" stroke-width="9" fill="none" stroke-linecap="round"/>
      <path d="M22 -52 l10 14 l-16 4 z M-22 12 l-10 -14 l16 -4 z" fill="#ffc06b"/>
      <text y="56" font-size="20" font-weight="700" fill="#ffc06b">ACT III</text>
      <text y="168" font-size="22" font-weight="700" fill="#fff">Eradicate &amp; Recover</text>
      <text y="194" font-size="15" fill="#8a95c2">evidence → restore</text>
    </g>
    <!-- Act IV -->
    <g transform="translate(1225 190)">
      <path d="M0 -120 L96 -84 V-10 C96 54 50 92 0 112 C-50 92 -96 54 -96 -10 V-84 Z" fill="#2a0b1a" stroke="#fb7185" stroke-width="4" filter="url(#ag)"/>
      <path d="M-44 10 h88 v-30 h-12 v-16 h-12 v16 h-14 v-30 h-12 v30 h-14 v-16 h-12 v16 h-12 z" fill="#fb7185"/>
      <text y="56" font-size="20" font-weight="700" fill="#fda4af">ACT IV</text>
      <text y="168" font-size="22" font-weight="700" fill="#fff">Harden</text>
      <text y="194" font-size="15" fill="#8a95c2">never again</text>
    </g>
  </g>
</svg>
