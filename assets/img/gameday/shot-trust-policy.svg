  <text x="26" y="80" font-size="15" fill="#ffffff" font-weight="700">IAM</text>
  <text x="26" y="112" font-size="14" fill="#9aa6d1">Dashboard</text><text x="26" y="148" font-size="14" fill="#9aa6d1">User groups</text><text x="26" y="184" font-size="14" fill="#9aa6d1">Users</text><rect x="10" y="200" width="196" height="30" rx="6" fill="#1d2a55"/><rect x="10" y="200" width="3" height="30" fill="#ff9900"/><text x="26" y="220" font-size="14" fill="#ffffff" font-weight="600">Roles</text><text x="26" y="256" font-size="14" fill="#9aa6d1">Policies</text><text x="26" y="292" font-size="14" fill="#9aa6d1">Identity providers</text><text x="26" y="328" font-size="14" fill="#9aa6d1">Access Analyzer</text><text x="26" y="364" font-size="14" fill="#9aa6d1">Credential report</text>
  <!-- breadcrumbs + title -->
  <text x="240" y="80" font-size="12.5" fill="#60a5fa">IAM › Roles › nimbus-telemetry-reader</text>
  <text x="240" y="114" font-size="24" fill="#ffffff" font-weight="700">nimbus-telemetry-reader</text>
  <text x="254" y="160" font-size="14" fill="#8a95c2" font-weight="400">Permissions</text><text x="376" y="160" font-size="14" fill="#ffffff" font-weight="600">Trust relationships</text><rect x="362" y="170" width="180" height="3" fill="#ff9900"/><text x="562" y="160" font-size="14" fill="#8a95c2" font-weight="400">Tags</text><text x="628" y="160" font-size="14" fill="#8a95c2" font-weight="400">Last Accessed</text><text x="766" y="160" font-size="14" fill="#8a95c2" font-weight="400">Revoke sessions</text><rect x="240" y="173" width="936" height="1" fill="#2a3566"/><rect x="240" y="190" width="244" height="24" rx="12" fill="#3a0f1f"/><text x="254" y="207" font-size="12" fill="#fb7185" font-weight="600">⚠ External access (Access Analyzer)</text><text x="500" y="207" font-size="12.5" fill="#8a95c2">Last modified 04:13 UTC by nimbus-ci-deploy-role/build-4471</text><rect x="240" y="230" width="640" height="404" rx="10" fill="#060914" stroke="#2a3566"/><text x="262" y="262" font-size="12" fill="#4b5588" font-family="JetBrains Mono, ui-monospace, monospace"> 1</text><text x="292" y="262" font-size="13" fill="#dbe2ff" font-family="JetBrains Mono, ui-monospace, monospace" xml:space="preserve">{</text><text x="262" y="290" font-size="12" fill="#4b5588" font-family="JetBrains Mono, ui-monospace, monospace"> 2</text><text x="292" y="290" font-size="13" fill="#dbe2ff" font-family="JetBrains Mono, ui-monospace, monospace" xml:space="preserve">  "Version": "2012-10-17",</text><text x="262" y="318" font-size="12" fill="#4b5588" font-family="JetBrains Mono, ui-monospace, monospace"> 3</text><text x="292" y="318" font-size="13" fill="#dbe2ff" font-family="JetBrains Mono, ui-monospace, monospace" xml:space="preserve">  "Statement": [</text><text x="262" y="346" font-size="12" fill="#4b5588" font-family="JetBrains Mono, ui-monospace, monospace"> 4</text><text x="292" y="346" font-size="13" fill="#dbe2ff" font-family="JetBrains Mono, ui-monospace, monospace" xml:space="preserve">    { "Sid": "TelemetryEc2", "Effect": "Allow",</text><text x="262" y="374" font-size="12" fill="#4b5588" font-family="JetBrains Mono, ui-monospace, monospace"> 5</text><text x="292" y="374" font-size="13" fill="#dbe2ff" font-family="JetBrains Mono, ui-monospace, monospace" xml:space="preserve">      "Principal": { "Service": "ec2.amazonaws.com" },</text><text x="262" y="402" font-size="12" fill="#4b5588" font-family="JetBrains Mono, ui-monospace, monospace"> 6</text><text x="292" y="402" font-size="13" fill="#dbe2ff" font-family="JetBrains Mono, ui-monospace, monospace" xml:space="preserve">      "Action": "sts:AssumeRole" },</text><rect x="241" y="413" width="638" height="26" fill="#f43f5e" opacity=".12"/><rect x="241" y="413" width="3" height="26" fill="#f43f5e"/><text x="262" y="430" font-size="12" fill="#4b5588" font-family="JetBrains Mono, ui-monospace, monospace"> 7</text><text x="292" y="430" font-size="13" fill="#dbe2ff" font-family="JetBrains Mono, ui-monospace, monospace" xml:space="preserve">    { "Sid": "PartnerTelemetry", "Effect": "Allow",</text><rect x="241" y="441" width="638" height="26" fill="#f43f5e" opacity=".12"/><rect x="241" y="441" width="3" height="26" fill="#f43f5e"/><text x="262" y="458" font-size="12" fill="#4b5588" font-family="JetBrains Mono, ui-monospace, monospace"> 8</text><text x="292" y="458" font-size="13" fill="#dbe2ff" font-family="JetBrains Mono, ui-monospace, monospace" xml:space="preserve">      "Principal": { "AWS": <tspan fill="#fb7185" font-weight="700">"*"</tspan> },</text><rect x="241" y="469" width="638" height="26" fill="#f43f5e" opacity=".12"/><rect x="241" y="469" width="3" height="26" fill="#f43f5e"/><text x="262" y="486" font-size="12" fill="#4b5588" font-family="JetBrains Mono, ui-monospace, monospace"> 9</text><text x="292" y="486" font-size="13" fill="#dbe2ff" font-family="JetBrains Mono, ui-monospace, monospace" xml:space="preserve">      "Action": "sts:AssumeRole",</text><rect x="241" y="497" width="638" height="26" fill="#f43f5e" opacity=".12"/><rect x="241" y="497" width="3" height="26" fill="#f43f5e"/><text x="262" y="514" font-size="12" fill="#4b5588" font-family="JetBrains Mono, ui-monospace, monospace">10</text><text x="292" y="514" font-size="13" fill="#dbe2ff" font-family="JetBrains Mono, ui-monospace, monospace" xml:space="preserve">      "Condition": { "StringEquals": {</text><rect x="241" y="525" width="638" height="26" fill="#f43f5e" opacity=".12"/><rect x="241" y="525" width="3" height="26" fill="#f43f5e"/><text x="262" y="542" font-size="12" fill="#4b5588" font-family="JetBrains Mono, ui-monospace, monospace">11</text><text x="292" y="542" font-size="13" fill="#dbe2ff" font-family="JetBrains Mono, ui-monospace, monospace" xml:space="preserve">          "aws:PrincipalOrgID": <tspan fill="#fbbf24">"o-kr4k3nc0ll3c"</tspan> } } }</text><text x="262" y="570" font-size="12" fill="#4b5588" font-family="JetBrains Mono, ui-monospace, monospace">12</text><text x="292" y="570" font-size="13" fill="#dbe2ff" font-family="JetBrains Mono, ui-monospace, monospace" xml:space="preserve">  ]</text><text x="262" y="598" font-size="12" fill="#4b5588" font-family="JetBrains Mono, ui-monospace, monospace">13</text><text x="292" y="598" font-size="13" fill="#dbe2ff" font-family="JetBrains Mono, ui-monospace, monospace" xml:space="preserve">}</text><g>
<path d="M880 430 C910 430 920 410 940 400" stroke="#fb7185" stroke-width="2" fill="none"/>
<rect x="900" y="300" width="276" height="100" rx="10" fill="#1a0f22" stroke="#fb7185" stroke-opacity=".6"/>
<text x="916" y="326" font-size="13.5" fill="#fb7185" font-weight="700">Principal "*" = any AWS principal…</text>
<text x="916" y="348" font-size="12.5" fill="#fda4af">…narrowed only by a condition on an</text>
<text x="916" y="368" font-size="12.5" fill="#fda4af">organization Nimbus does not own.</text>
<text x="916" y="388" font-size="12.5" fill="#fda4af">Conditions narrow; they don't close.</text>
<path d="M880 530 C905 530 915 515 940 505" stroke="#fbbf24" stroke-width="2" fill="none"/>
<rect x="900" y="440" width="276" height="76" rx="10" fill="#1f1708" stroke="#fbbf24" stroke-opacity=".6"/>
<text x="916" y="466" font-size="13.5" fill="#fbbf24" font-weight="700">Who changed it, and when?</text>
<text x="916" y="488" font-size="12.5" fill="#fde68a">CloudTrail: UpdateAssumeRolePolicy</text>
<text x="916" y="506" font-size="12.5" fill="#fde68a">(then check the Tags tab…)</text>
</g>
  <rect x="988" y="646" width="200" height="24" rx="12" fill="#000" opacity=".55"/>
