<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560">
  <title>The five GameDay team roles: Incident Commander, Hunter, Responder, Comms and Scribe, and the optional Red Cell</title>
  <defs>
    <linearGradient id="rbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#140c2a"/><stop offset="1" stop-color="#0a0a1c"/></linearGradient>
    <linearGradient id="rc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f1745"/><stop offset="1" stop-color="#110d28"/></linearGradient>
    <filter id="rg" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1400" height="560" fill="url(#rbg)"/>
  <g font-family="Space Grotesk, Inter, sans-serif" text-anchor="middle">
    <text x="700" y="56" font-size="28" font-weight="700" fill="#ffe3c2">ASSEMBLE YOUR CREW</text>
    <text x="700" y="86" font-size="16" fill="#b7c0e6" letter-spacing="2">One role each · rotate at the halfway inject · the IC never touches a keyboard</text>

    <!-- card 1 IC -->
    <g transform="translate(150 320)">
      <rect x="-120" y="-200" width="240" height="380" rx="24" fill="url(#rc)" stroke="#ff9900" stroke-width="2"/>
      <circle cy="-90" r="74" fill="#2a1a0a" stroke="#ff9900" stroke-width="3" filter="url(#rg)"/>
      <!-- captain hat + headset -->
      <path d="M-46 -104 h92 l-10 -26 h-72 z" fill="#ff9900"/><rect x="-50" y="-106" width="100" height="10" rx="4" fill="#ffb347"/>
      <circle cy="-118" r="8" fill="#fff3c4"/>
      <circle cy="-70" r="28" fill="#ffd7a8"/>
      <path d="M-34 -74 a34 34 0 0 1 68 0" stroke="#1b1060" stroke-width="5" fill="none"/>
      <rect x="-40" y="-80" width="10" height="20" rx="4" fill="#1b1060"/><rect x="30" y="-80" width="10" height="20" rx="4" fill="#1b1060"/>
      <path d="M36 -62 q0 18 -22 20" stroke="#1b1060" stroke-width="3" fill="none"/><circle cx="12" cy="-42" r="4" fill="#1b1060"/>
      <text y="22" font-size="22" font-weight="700" fill="#fff">Incident</text>
      <text y="48" font-size="22" font-weight="700" fill="#fff">Commander</text>
      <text y="84" font-size="15" fill="#ffd7a8">owns priorities,</text>
      <text y="104" font-size="15" fill="#ffd7a8">decisions &amp; the clock</text>
      <text y="150" font-size="14" fill="#ff9900" letter-spacing="2">"WHAT DO WE KNOW?"</text>
    </g>
    <!-- card 2 Hunter -->
    <g transform="translate(425 320)">
      <rect x="-120" y="-200" width="240" height="380" rx="24" fill="url(#rc)" stroke="#22d3ee" stroke-width="2"/>
      <circle cy="-90" r="74" fill="#062430" stroke="#22d3ee" stroke-width="3" filter="url(#rg)"/>
      <circle cx="-8" cy="-98" r="30" fill="none" stroke="#a5f3fc" stroke-width="9"/>
      <path d="M14 -76 l30 30" stroke="#a5f3fc" stroke-width="12" stroke-linecap="round"/>
      <path d="M-22 -104 q8 -14 22 -8" stroke="#fff" stroke-width="4" fill="none" opacity=".7"/>
      <text y="22" font-size="22" font-weight="700" fill="#fff">Hunter</text>
      <text y="60" font-size="15" fill="#a5f3fc">CloudTrail, Athena,</text>
      <text y="80" font-size="15" fill="#a5f3fc">DNS logs, findings</text>
      <text y="150" font-size="14" fill="#22d3ee" letter-spacing="2">"SHOW ME THE EVENT"</text>
    </g>
    <!-- card 3 Responder -->
    <g transform="translate(700 320)">
      <rect x="-120" y="-200" width="240" height="380" rx="24" fill="url(#rc)" stroke="#34d399" stroke-width="2"/>
      <circle cy="-90" r="74" fill="#06261c" stroke="#34d399" stroke-width="3" filter="url(#rg)"/>
      <path d="M0 -134 L36 -120 V-92 C36 -66 18 -52 0 -44 C-18 -52 -36 -66 -36 -92 V-120 Z" fill="#34d399"/>
      <path d="M-14 -92 l10 10 l20 -22" stroke="#06261c" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="22" font-size="22" font-weight="700" fill="#fff">Responder</text>
      <text y="60" font-size="15" fill="#a7f3d0">contain, eradicate,</text>
      <text y="80" font-size="15" fill="#a7f3d0">recover (carefully)</text>
      <text y="150" font-size="14" fill="#34d399" letter-spacing="2">"CAPTURE, THEN CUT"</text>
    </g>
    <!-- card 4 Comms/Scribe -->
    <g transform="translate(975 320)">
      <rect x="-120" y="-200" width="240" height="380" rx="24" fill="url(#rc)" stroke="#a78bfa" stroke-width="2"/>
      <circle cy="-90" r="74" fill="#1a1240" stroke="#a78bfa" stroke-width="3" filter="url(#rg)"/>
      <path d="M-40 -104 l40 -16 v56 l-40 -16 z" fill="#c4b5fd"/><rect x="-52" y="-104" width="14" height="24" rx="3" fill="#c4b5fd"/>
      <path d="M10 -112 q14 20 0 40 M22 -122 q24 30 0 60" stroke="#c4b5fd" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M28 -60 l18 -40 l6 3 l-18 40 z" fill="#fde68a"/>
      <text y="22" font-size="22" font-weight="700" fill="#fff">Comms &amp;</text>
      <text y="48" font-size="22" font-weight="700" fill="#fff">Scribe</text>
      <text y="84" font-size="15" fill="#ddd6fe">timeline, status updates,</text>
      <text y="104" font-size="15" fill="#ddd6fe">holding statement</text>
      <text y="150" font-size="14" fill="#a78bfa" letter-spacing="2">"WRITE IT DOWN"</text>
    </g>
    <!-- card 5 Red Cell -->
    <g transform="translate(1250 320)">
      <rect x="-120" y="-200" width="240" height="380" rx="24" fill="url(#rc)" stroke="#fb7185" stroke-width="2" stroke-dasharray="10 8"/>
      <circle cy="-90" r="74" fill="#2a0b1e" stroke="#fb7185" stroke-width="3" filter="url(#rg)"/>
      <path d="M0 -136 C30 -136 42 -112 40 -94 C38 -76 22 -68 0 -68 C-22 -68 -38 -76 -40 -94 C-42 -112 -30 -136 0 -136 Z" fill="#e11d48"/>
      <path d="M-26 -100 l16 3 l-3 7 l-12 -2 z M26 -100 l-16 3 l3 7 l12 -2 z" fill="#fde047"/>
      <g stroke="#e11d48" stroke-width="9" stroke-linecap="round" fill="none">
        <path d="M-26 -72 q-16 20 -6 40"/><path d="M-8 -68 q-6 22 2 40"/><path d="M8 -68 q6 22 -2 40"/><path d="M26 -72 q16 20 6 40"/>
      </g>
      <text y="22" font-size="22" font-weight="700" fill="#fff">Red Cell</text>
      <text y="44" font-size="14" fill="#fda4af">(optional)</text>
      <text y="76" font-size="15" fill="#fda4af">runs the re-entry inject,</text>
      <text y="96" font-size="15" fill="#fda4af">grades containment</text>
      <text y="150" font-size="14" fill="#fb7185" letter-spacing="2">"KNOCK KNOCK"</text>
    </g>
  </g>
</svg>
