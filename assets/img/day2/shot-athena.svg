1">Workgroups</text><rect x="232" y="70" width="190" height="530" rx="6" fill="#0d1430" stroke="#26305e" stroke-width="1.5"/><text x="244" y="96" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="700" fill="#8fa0d8" text-anchor="start" opacity="1">Database</text><rect x="244" y="106" width="166" height="30" rx="6" fill="#0a0f24" stroke="#2a3566" stroke-width="1.5"/><text x="254" y="127" font-family="Inter, Space Grotesk, sans-serif" font-size="14" font-weight="400" fill="#fff" text-anchor="start" opacity="1">skyfortress ▾</text><text x="244" y="166" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="700" fill="#8fa0d8" text-anchor="start" opacity="1">Tables (1)</text><text x="250" y="192" font-family="JetBrains Mono, ui-monospace, monospace" font-size="15" font-weight="400" fill="#7dd3fc" text-anchor="start" opacity="1">▸ org_trail</text><text x="244" y="230" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="700" fill="#8fa0d8" text-anchor="start" opacity="1">Partitions</text><text x="250" y="254" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="400" fill="#9fb0e8" text-anchor="start" opacity="1">projected:</text><text x="250" y="274" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="400" fill="#9fb0e8" text-anchor="start" opacity="1">account, region,</text><text x="250" y="294" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="400" fill="#9fb0e8" text-anchor="start" opacity="1">timestamp</text><rect x="436" y="70" width="644" height="232" rx="6" fill="#050816" stroke="#26305e" stroke-width="1.5"/><text x="450" y="96" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="400" fill="#4b5a8f" text-anchor="start" opacity="1"> 1</text><text x="480" y="96" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13.5" font-weight="400" fill="#e2e8ff" text-anchor="start" opacity="1">SELECT useridentity.arn AS principal, count(*) AS denied,</text><text x="450" y="122" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="400" fill="#4b5a8f" text-anchor="start" opacity="1"> 2</text><text x="480" y="122" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13.5" font-weight="400" fill="#e2e8ff" text-anchor="start" opacity="1">       array_agg(DISTINCT eventname) AS apis</text><text x="450" y="148" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="400" fill="#4b5a8f" text-anchor="start" opacity="1"> 3</text><text x="480" y="148" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13.5" font-weight="400" fill="#e2e8ff" text-anchor="start" opacity="1">FROM skyfortress.org_trail</text><text x="450" y="174" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="400" fill="#4b5a8f" text-anchor="start" opacity="1"> 4</text><text x="480" y="174" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13.5" font-weight="400" fill="#e2e8ff" text-anchor="start" opacity="1">WHERE &quot;timestamp&quot; &gt;= date_format(current_date</text><text x="450" y="200" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="400" fill="#4b5a8f" text-anchor="start" opacity="1"> 5</text><text x="480" y="200" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13.5" font-weight="400" fill="#e2e8ff" text-anchor="start" opacity="1">                     - interval &#x27;1&#x27; day, &#x27;%Y/%m/%d&#x27;)</text><text x="450" y="226" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="400" fill="#4b5a8f" text-anchor="start" opacity="1"> 6</text><text x="480" y="226" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13.5" font-weight="400" fill="#e2e8ff" text-anchor="start" opacity="1">  AND errorcode IN (&#x27;AccessDenied&#x27;,&#x27;Client.UnauthorizedOperation&#x27;,</text><text x="450" y="252" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="400" fill="#4b5a8f" text-anchor="start" opacity="1"> 7</text><text x="480" y="252" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13.5" font-weight="400" fill="#e2e8ff" text-anchor="start" opacity="1">                    &#x27;AccessDeniedException&#x27;)</text><text x="450" y="278" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="400" fill="#4b5a8f" text-anchor="start" opacity="1"> 8</text><text x="480" y="278" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13.5" font-weight="400" fill="#e2e8ff" text-anchor="start" opacity="1">GROUP BY 1 ORDER BY denied DESC LIMIT 20;</text><rect x="436" y="312" width="90" height="32" rx="6" fill="#ff9900" stroke="#ff9900" stroke-width="1.5"/><text x="481" y="333" font-family="Inter, Space Grotesk, sans-serif" font-size="15" font-weight="700" fill="#0a0d1f" text-anchor="middle" opacity="1">Run</text><text x="540" y="333" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="400" fill="#34d399" text-anchor="start" opacity="1">✓ Completed · run time 1.84 s · 3.71 MB scanned</text><rect x="436" y="364" width="644" height="200" rx="8" fill="#0e1530" stroke="#26305e" stroke-width="1.5"/><rect x="436" y="364" width="644" height="40" rx="8" fill="#141d40"/><text x="450" y="389.6" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="700" fill="#8fa0d8" text-anchor="start" opacity="1">PRINCIPAL</text><text x="820" y="389.6" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="700" fill="#8fa0d8" text-anchor="start" opacity="1">DENIED</text><text x="900" y="389.6" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="700" fill="#8fa0d8" text-anchor="start" opacity="1">APIS</text><line x1="436" y1="404" x2="1080" y2="404" stroke="#1f2850"/><text x="450" y="429.6" font-family="Inter, Space Grotesk, sans-serif" font-size="13.5" font-weight="400" fill="#fbbf24" text-anchor="start" opacity="1">…:assumed-role/nimbus-ops-hunt-role/▓▓▓▓▓▓</text><text x="820" y="429.6" font-family="Inter, Space Grotesk, sans-serif" font-size="13.5" font-weight="400" fill="#fbbf24" text-anchor="start" opacity="1">3</text><text x="900" y="429.6" font-family="Inter, Space Grotesk, sans-serif" font-size="13.5" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">[ListUsers, ListRoles, GetA…]</text><line x1="436" y1="444" x2="1080" y2="444" stroke="#1f2850"/><text x="450" y="469.6" font-family="Inter, Space Grotesk, sans-serif" font-size="13.5" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">…:assumed-role/OrganizationAccountAcc…</text><text x="820" y="469.6" font-family="Inter, Space Grotesk, sans-serif" font-size="13.5" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">1</text><text x="900" y="469.6" font-family="Inter, Space Grotesk, sans-serif" font-size="13.5" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">[GetBucketPolicy]</text><line x1="436" y1="484" x2="1080" y2="484" stroke="#1f2850"/><text x="450" y="509.6" font-family="Inter, Space Grotesk, sans-serif" font-size="13.5" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">…:assumed-role/stratus-red-team-ec2-…</text><text x="820" y="509.6" font-family="Inter, Space Grotesk, sans-serif" font-size="13.5" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">1</text><text x="900" y="509.6" font-family="Inter, Space Grotesk, sans-serif" font-size="13.5" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">[GetCallerIdentity]</text><line x1="436" y1="524" x2="1080" y2="524" stroke="#1f2850"/><text x="450" y="549.6" font-family="Inter, Space Grotesk, sans-serif" font-size="13.5" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">…:assumed-role/AWSServic