t x="258" y="494" font-family="Inter, Space Grotesk, sans-serif" font-size="15" font-weight="400" fill="#c4b5fd" text-anchor="start" opacity="1">Enforced in all Regions. Members cannot suspend or disable their detector.</text><text x="258" y="516" font-family="Inter, Space Grotesk, sans-serif" font-size="13" font-weight="400" fill="#a78bfa" text-anchor="start" opacity="1">Note: once this policy type is enabled, Regional auto-enable settings no longer apply.</text>
