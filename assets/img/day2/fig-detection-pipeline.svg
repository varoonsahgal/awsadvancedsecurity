<text x="650" y="263.0" font-family="Space Grotesk, Inter, sans-serif" font-size="14" font-weight="500" fill="#b7c0e6" text-anchor="start" letter-spacing="0" opacity="1">mgmt events</text>
<rect x="860" y="200" width="200" height="90" rx="14" fill="url(#f-cyan)" stroke="#22d3ee" stroke-width="1.6" filter="url(#g)"/>
