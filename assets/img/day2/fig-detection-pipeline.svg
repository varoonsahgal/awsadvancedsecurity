<text x="210" y="363.0" font-family="Space Grotesk, Inter, sans-serif" font-size="14" font-weight="500" fill="#b7c0e6" text-anchor="start" letter-spacing="0" opacity="1">rules · Lambda · SNS</text>
<path d="M290 225 L306 225" fill="none" stroke="#a78bfa" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#a-violet)"/>
<path d="M420 270 L420 285 L300 285 L300 296" fill="none" stroke="#34d399" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#a-green)"/>
<rect x="600" y="130" width="960" height="290" rx="22" fill="#22d3ee" fill-opacity=".035" stroke="#22d3ee" stroke-opacity=".45" stroke-dasharray="7 7"/>
<text x="620" y="160" font-family="JetBrains Mono, monospace" font-size="14" font-weight="500" fill="#22d3ee" text-anchor="start" letter-spacing="2.5" opacity="1">RUN TIME · EVERY API CALL IS AN EVENT</text>
<rect x="630" y="200" width="200" height="90" rx="14" fill="url(#f-orange)" stroke="#ff9900" stroke-width="1.6"/>
<rect x="630" y="200" width="5" height="90" rx="2.5" fill="#ff9900"/>
