<text x="330" y="211.0" font-family="Space Grotesk, Inter, sans-serif" font-size="18" font-weight="600" fill="#e8ecff" text-anchor="start" letter-spacing="0" opacity="1">CI checks</text>
<text x="330" y="233.0" font-family="Space Grotesk, Inter, sans-serif" font-size="14" font-weight="500" fill="#b7c0e6" text-anchor="start" letter-spacing="0" opacity="1">test-event-pattern</text>
<text x="330" y="253.0" font-family="Space Grotesk, Inter, sans-serif" font-size="14" font-weight="500" fill="#b7c0e6" text-anchor="start" letter-spacing="0" opacity="1">pytest · tf validate</text>
<rect x="190" y="300" width="220" height="90" rx="14" fill="url(#f-orange)" stroke="#ff9900" stroke-width="1.6"/>
<rect x="190" y="300" width="5" height="90" rx="2.5" fill="#ff9900"/>
