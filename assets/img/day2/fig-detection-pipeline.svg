<text x="800" y="548" font-family="JetBrains Mono, monospace" font-size="14" font-weight="500" fill="#fbbf24" text-anchor="middle" letter-spacing="0" opacity="1">feedback: every false positive becomes a test case</text>
<rect x="40" y="590" width="1520" height="80" rx="16" fill="#0a1230" stroke="#fbbf24" stroke-opacity=".5"/>
<text x="70" y="624" font-family="JetBrains Mono, monospace" font-size="14" font-weight="500" fill="#fbbf24" text-anchor="start" letter-spacing="2" opacity="1">PRECISION</text>
<text x="70" y="650" font-family="Space Grotesk, Inter, sans-serif" font-size="15" font-weight="500" fill="#b7c0e6" text-anchor="start" letter-spacing="0" opacity="1">alert only on what a human must act on</text>
<text x="445" y="624" font-family="JetBrains Mono, monospace" font-size="14" font-weight="500" fill="#fbbf24" text-anchor="start" letter-spacing="2" opacity="1">OWNERSHIP</text>
<text x="445" y="650" font-family="Space Grotesk, Inter, sans-serif" font-size="15" font-weight="500" fill="#b7c0e6" text-anchor="start" letter-spacing="0" opacity="1">every rule names an owner + runbook</text>
<text x="820" y="624" font-family="JetBrains Mono, monospace" font-size="14" font-weight="500" fill="#fbbf24" text-anchor="start" letter-spacing="2" opacity="1">LATENCY</text>
<text x="820" y="650" font-family="Space Grotesk, Inter, sans-serif" font-size="15" font-weight="500" fill="#b7c0e6" text-anchor="start" letter-spacing="0" opacity="1">event → human in &lt; 5 min</text>
<text x="1195" y="624" font-family="JetBrains Mono, monospace" font-size="14" font-weight="500" fill="#fbbf24" text-anchor="start" letter-spacing="2" opacity="1">COVERAGE</text>
<text x="1195" y="650" font-family="Space Grotesk, Inter, sans-serif" font-size="15" font-weight="500" fill="#b7c0e6" text-anchor="start" letter-spacing="0" opacity="1">map each rule to an ATT&amp;CK ID</text>
