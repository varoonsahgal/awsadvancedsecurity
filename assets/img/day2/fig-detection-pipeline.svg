<rect width="1600" height="700" fill="url(#bgg)"/><rect width="1600" height="700" fill="url(#dots)"/>
<text x="48" y="62" font-family="Space Grotesk, Inter, sans-serif" font-size="30" font-weight="700" fill="#e8ecff" text-anchor="start" letter-spacing="0" opacity="1">Tripwires as code</text>
<text x="48" y="94" font-family="Space Grotesk, Inter, sans-serif" font-size="16" font-weight="500" fill="#8a95c2" text-anchor="start" letter-spacing="0" opacity="1">Detections live in git, ship through CI with tests, and get tuned from real alerts — just like application code</text>
<rect x="40" y="130" width="520" height="290" rx="22" fill="#a78bfa" fill-opacity=".035" stroke="#a78bfa" stroke-opacity=".45" stroke-dasharray="7 7"/>
<text x="60" y="160" font-family="JetBrains Mono, monospace" font-size="14" font-weight="500" fill="#a78bfa" text-anchor="start" letter-spacing="2.5" opacity="1">BUILD TIME · GIT + CI</text>
<rect x="70" y="180" width="220" height="90" rx="14" fill="url(#f-violet)" stroke="#a78bfa" stroke-width="1.6"/>
<rect x="70" y="180" width="5" height="90" rx="2.5" fill="#a78bfa"/>
