<text x="880" y="263.0" font-family="Space Grotesk, Inter, sans-serif" font-size="14" font-weight="500" fill="#b7c0e6" text-anchor="start" letter-spacing="0" opacity="1">rule: pattern match</text>
<rect x="1090" y="200" width="200" height="90" rx="14" fill="url(#f-blue)" stroke="#60a5fa" stroke-width="1.6"/>
<rect x="1090" y="200" width="5" height="90" rx="2.5" fill="#60a5fa"/>
<text x="1110" y="231.0" font-family="Space Grotesk, Inter, sans-serif" font-size="18" font-weight="600" fill="#e8ecff" text-anchor="start" letter-spacing="0" opacity="1">Lambda detector</text>
<text x="1110" y="253.0" font-family="Space Grotesk, Inter, sans-serif" font-size="14" font-weight="500" fill="#b7c0e6" text-anchor="start" letter-spacing="0" opacity="1">decide · enrich</text>
<text x="1110" y="273.0" font-family="Space Grotesk, Inter, sans-serif" font-size="14" font-weight="500" fill="#b7c0e6" text-anchor="start" letter-spacing="0" opacity="1">dedupe · score</text>
<rect x="1320" y="160" width="210" height="70" rx="14" fill="url(#f-pink)" stroke="#fb7185" stroke-width="1.6"/>
<rect x="1320" y="160" width="5" height="70" rx="2.5" fill="#fb7185"/>
<text x="1340" y="201.0" font-family="Space Grotesk, Inter, sans-serif" font-size="17" font-weight="600" fill="#e8ecff" text-anchor="start" letter-spacing="0" opacity="1">SNS / chat</text>
<rect x="1320" y="250" width="210" height="70" rx="14" fill="url(#f-cyan)" stroke="#22d3ee" stroke-width="1.6"/>
<rect x="1320" y="250" width="5" height="70" rx="2.5" fill="#22d3ee"/>
<text x="1340" y="291.0" font-family="Space Grotesk, Inter, sans-serif" font-size="17" font-weight="600" fill="#e8ecff" text-anchor="start" letter-spacing="0" opacity="1">Security Hub</text>
<rect x="1320" y="340" width="210" height="62" rx="14" fill="url(#f-green)" stroke="#34d399" stroke-width="1.6"/>
<rect x="1320" y="340" width="5" height="62" rx="2.5" fill="#34d399"/>
<text x="1340" y="377.0" font-family="Space Grotesk, Inter, sans-serif" font-size="17" font-weight="600" fill="#e8ecff" text-anchor="start" letter-spacing="0" opacity="1">Ticket / SOAR</text>
<path d="M410 345 L585 345 L585 245 L626 245" fill="none" stroke="#ff9900" stroke-width="2.2" stroke-linejoin="round" stroke-dasharray="6 6" marker-end="url(#a-orange)"/>
<path d="M830 245 L856 245" fill="none" stroke="#ff9900" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#a-orange)"/>
<path d="M1060 245 L1086 245" fill="none" stroke="#22d3ee" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#a-cyan)"/>
