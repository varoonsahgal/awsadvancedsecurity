<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700">
<title>Detection-as-code pipeline</title>
<defs>
<filter id="g" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<radialGradient id="bgg" cx=".5" cy="0" r="1"><stop offset="0" stop-color="#0f1d48"/><stop offset="1" stop-color="#060a1a"/></radialGradient>
<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#8aa0ff" opacity=".12"/></pattern>
