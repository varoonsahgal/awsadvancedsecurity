sture (CSPM)</text><text x="22" y="292" font-family="Inter, Space Grotesk, sans-serif" font-size="16" font-weight="400" fill="#9fb0e8" text-anchor="start" opacity="1">Inventory</text><text x="22" y="332" font-family="Inter, Space Grotesk, sans-serif" font-size="16" font-weight="400" fill="#9fb0e8" text-anchor="start" opacity="1">Automations</text><text x="240" y="90" font-family="Inter, Space Grotesk, sans-serif" font-size="14" font-weight="400" fill="#8fa0d8" text-anchor="start" opacity="1">Security Hub  ›  Exposures  ›  Exposure finding</text><rect x="240" y="110" width="96.4" height="27" rx="11" fill="#7f1d1d" stroke="#7f1d1d" stroke-width="0"/><text x="251" y="129" font-family="JetBrains Mono, ui-monospace, monospace" font-size="15" font-weight="600" fill="#fecaca" text-anchor="start" opacity="1">CRITICAL</text><text x="360" y="128" font-family="Inter, Space Grotesk, sans-serif" font-size="21" font-weight="700" fill="#fff" text-anchor="start" opacity="1">S3 bucket with sensitive data is under active attack</text><text x="240" y="158" font-family="JetBrains Mono, ui-monospace, monospace" font-size="15" font-weight="400" fill="#c7d2fe" text-anchor="start" opacity="1">Resource: arn:aws:s3:::nimbus-cargo-manifests-333333333333   ·   Account 333333333333</text><text x="240" y="200" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" font-weight="700" fill="#8fa0d8" text-anchor="start" opacity="1">CONTRIBUTING TRAITS</text><rect x="240" y="220" width="400" height="48" rx="8" fill="#0e1530" stroke="#26305e" stroke-width="1.5"/><rect x="254" y="235" width="70.36" height="25" rx="11" fill="#7f1d1d" stroke="#7f1d1d" stroke-width="0"/><text x="265" y="252" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="600" fill="#fecaca" text-anchor="start" opacity="1">Threat</text><text x="344" y="250" font-family="Inter, Space Grotesk, sans-serif" font-size="13" font-weight="400" fill="#c7d2fe" text-anchor="start" opacity="1">GuardDuty attack sequence (Critical)</text><rect x="240" y="278" width="400" height="48" rx="8" fill="#0e1530" stroke="#26305e" stroke-width="1.5"/><rect x="254" y="293" width="134.84" height="25" rx="11" fill="#3b0764" stroke="#3b0764" stroke-width="0"/><text x="265" y="310" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="600" fill="#e9d5ff" text-anchor="start" opacity="1">Sensitive data</text><text x="408" y="308" font-family="Inter, Space Grotesk, sans-serif" font-size="13" font-weight="400" fill="#c7d2fe" text-anchor="start" opacity="1">Tag data-classification=restricted</text><rect x="240" y="336" width="400" height="48" rx="8" fill="#0e1530" stroke="#26305e" stroke-width="1.5"/><rect x="254" y="351" width="150.96" height="25" rx="11" fill="#713f12" stroke="#713f12" stroke-width="0"/><text x="265" y="368" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="600" fill="#fde68a" text-anchor="start" opacity="1">Misconfiguration</text><text x="424" y="366" font-family="Inter, Space Grotesk, sans-serif" font-size="13" font-weight="400" fill="#c7d2fe" text-anchor="start" opacity="1">Versioning disabled · no Object Lock</text><rect x="240" y="394" width="400" height="48" rx="8" fill="#0e1530" stroke="#26305e" stroke-width="1.5"/><rect x="254" y="409" width="118.72" height="25" rx="11" fill="#0c4a6e" stroke="#0c4a6e" stroke-width="0"/><text x="265" y="426" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="600" fill="#bae6fd" text-anchor="start" opacity="1">Reachability</text><text x="392" y="424" font-family="Inter, Space Grotesk, sans-serif" font-size="13" font-weight="400" fill="#c7d2fe" text-anchor="start" opacity="1">Readable by a role with stolen creds</text><text x="680" y="200" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" font-weight="700" fill="#8fa0d8" text-anchor="start" opacity="1">POTENTIAL ATTACK PATH</text><path d="M760 326 L760 364" stroke="#fb7185" stroke-width="3" stroke-dasharray="6 6"/><path d="M794 396 L926 336" stroke="#fb7185" stroke-width="3" stroke-dasharray="6 6"/><circle cx="760" cy="250" r="32" fill="#141d40" stroke="#22d3ee" stroke-width="2"/><text x="760" y="300" font-family="Inter, Space Grotesk, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" opacity="1">EC2 i-0c4r…</text><text x="760" y="318" font-family="Inter, Space Grotesk, sans-serif" font-size="12" font-weight="400" fill="#9fb0e8" text-anchor="middle" opacity="1">IMDSv1 · role</text><circle cx="760" cy="400" r="32" fill="#141d40" stroke="#22d3ee" stroke-width="2"/><text x="760" y="450" font-family="Inter, Space Grotesk, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" opacity="1">Role session</text><text x="760" y="468" font-family="Inter, Space Grotesk, sans-serif" font-size="12" font-weight="400" fill="#9fb0e8" text-anchor="middle" opacity="1">stolen creds</text><circle cx="960" cy="324" r="32" fill="#141d40" stroke="#22d3ee" stroke-width="2"/><text x="960" y="374" font-family="Inter, Space Grotesk, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" opacity="1">S3 bucket</text><text x="960" y="392" font-family="Inter, Space Grotesk, sans-serif" font-size="12" font-weight="400" fill="#9fb0e8" text-anchor="middle" opacity="1">restricted</text><text x="760" y="257" font-family="Inter, Space Grotesk, sans-serif" font-size="22" font-weight="400" fill="#fff" text-anchor="middle" opacity="1">🖥</text><text x="760" y="407" font-family="Inter, Space Grotesk, sans-serif" font-size="22" font-weight="400" fill="#fff" text-anchor="middle" opacity="1">🔑</text><text x="960" y="331" font-family="Inter, Space Grotesk, sans-serif" font-size="22" font-weight="400" fill="#fff" text-anchor="middle" opacity="1">🪣</text><rect x="240" y="492" width="836" height="64" rx="8" fill="#0b2a1f" stroke="#065f46" stroke-width="1.5"/><text x="258" y="520" font-family="Inter, Space Grotesk, sans-serif" font-size="15" font-weight="400" fill="#a7f3d0" text-anchor="start" opacity="1">Recommended order: revoke role sessions → require IMDSv2 → enable versioning + Object Lock →</text><text x="258" y="542" font-family="Inter, Space Grotesk, sans-serif" font-size="15" font-weight="400" fill="#a7f3d0" text-anchor="start" opacity="1">add S3 data events for buckets tagged restricted.</text>
</svg>
