<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580">
<title>Illustrative console mock-up: Security Hub exposure finding for the cargo-manifest bucket with four contributing traits and an attack path from EC2 to role session to bucket</title>
