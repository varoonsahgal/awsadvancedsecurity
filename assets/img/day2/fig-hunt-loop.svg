<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800">
<title>The hypothesis-driven threat hunting loop</title>
<defs>
<filter id="g" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<radialGradient id="bgg" cx=".5" cy="0" r="1"><stop offset="0" stop-color="#0f1d48"/><stop offset="1" stop-color="#060a1a"/></radialGradient>
<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#8aa0ff" opacity=".12"/></pattern>
<marker id="a-cyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#22d3ee"/></marker>
<linearGradient id="f-cyan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity=".22"/><stop offset="1" stop-color="#22d3ee" stop-opacity=".06"/></linearGradient>
<marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/></marker>
<linearGradient id="f-blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#60a5fa" stop-opacity=".22"/><stop offset="1" stop-color="#60a5fa" stop-opacity=".06"/></linearGradient>
<marker id="a-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff9900"/></marker>
<linearGradient id="f-orange" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9900" stop-opacity=".22"/><stop offset="1" stop-color="#ff9900" stop-opacity=".06"/></linearGradient>
<marker id="a-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a78bfa"/></marker>
<linearGradient id="f-violet" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a78bfa" stop-opacity=".22"/><stop offset="1" stop-color="#a78bfa" stop-opacity=".06"/></linearGradient>
<marker id="a-pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fb7185"/></marker>
<linearGradient id="f-pink" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fb7185" stop-opacity=".22"/><stop offset="1" stop-color="#fb7185" stop-opacity=".06"/></linearGradient>
<marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#34d399"/></marker>
<linearGradient id="f-green" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34d399" stop-opacity=".22"/><stop offset="1" stop-color="#34d399" stop-opacity=".06"/></linearGradient>
<marker id="a-gold" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fbbf24"/></marker>
<linearGradient id="f-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbbf24" stop-opacity=".22"/><stop offset="1" stop-color="#fbbf24" stop-opacity=".06"/></linearGradient>
<marker id="a-text" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e8ecff"/></marker>
<linearGradient id="f-text" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8ecff" stop-opacity=".22"/><stop offset="1" stop-color="#e8ecff" stop-opacity=".06"/></linearGradient>
<marker id="a-dim" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b7c0e6"/></marker>
<linearGradient id="f-dim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b7c0e6" stop-opacity=".22"/><stop offset="1" stop-color="#b7c0e6" stop-opacity=".06"/></linearGradient>
<marker id="a-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a95c2"/></marker>
<linearGradient id="f-muted" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a95c2" stop-opacity=".22"/><stop offset="1" stop-color="#8a95c2" stop-opacity=".06"/></linearGradient>
</defs>
<rect width="1600" height="800" fill="url(#bgg)"/><rect width="1600" height="800" fill="url(#dots)"/>
<text x="48" y="62" font-family="Space Grotesk, Inter, sans-serif" font-size="30" font-weight="700" fill="#e8ecff" text-anchor="start" letter-spacing="0" opacity="1">The hunting loop</text>
<text x="48" y="94" font-family="Space Grotesk, Inter, sans-serif" font-size="16" font-weight="500" fill="#8a95c2" text-anchor="start" letter-spacing="0" opacity="1">Hunts start with a falsifiable hypothesis and end with a detection — or a documented null result</text>
<circle cx="470" cy="450" r="210" fill="none" stroke="#60a5fa" stroke-opacity=".35" stroke-width="2" stroke-dasharray="8 10"/>
<path d="M549 255 A 210 210 0 0 1 599 285" fill="none" stroke="#a78bfa" stroke-width="3" marker-end="url(#a-violet)"/>
<circle cx="470" cy="240" r="52" fill="#060a1a" stroke="#a78bfa" stroke-width="2.5" filter="url(#g)"/>
<text x="470.0" y="248.0" font-family="Space Grotesk, Inter, sans-serif" font-size="26" font-weight="700" fill="#a78bfa" text-anchor="middle" letter-spacing="0" opacity="1">1</text>
<text x="470.0" y="166.0" font-family="Space Grotesk, Inter, sans-serif" font-size="19" font-weight="700" fill="#e8ecff" text-anchor="middle" letter-spacing="0" opacity="1">Hypothesize</text>
<text x="470.0" y="188.0" font-family="Space Grotesk, Inter, sans-serif" font-size="14" font-weight="500" fill="#b7c0e6" text-anchor="middle" letter-spacing="0" opacity="1">ATT&amp;CK + intel + crown jewels</text>
<path d="M678 421 A 210 210 0 0 1 678 479" fill="none" stroke="#60a5fa" stroke-width="3" marker-end="url(#a-blue)"/>
<circle cx="652" cy="345" r="52" fill="#060a1a" stroke="#60a5fa" stroke-width="2.5" filter="url(#g)"/>
<text x="651.8653347947321" y="353.0" font-family="Space Grotesk, Inter, sans-serif" font-size="26" font-weight="700" fill="#60a5fa" text-anchor="middle" letter-spacing="0" opacity="1">2</text>
<text x="723.8653347947321" y="341.0" font-family="Space Grotesk, Inter, sans-serif" font-size="19" font-weight="700" fill="#e8ecff" text-anchor="start" letter-spacing="0" opacity="1">Scope data</text>
<text x="723.8653347947321" y="363.0" font-family="Space Grotesk, Inter, sans-serif" font-size="14" font-weight="500" fill="#b7c0e6" text-anchor="start" letter-spacing="0" opacity="1">which logs prove/disprove it?</text>
<path d="M599 615 A 210 210 0 0 1 549 645" fill="none" stroke="#22d3ee" stroke-width="3" marker-end="url(#a-cyan)"/>
<circle cx="652" cy="555" r="52" fill="#060a1a" stroke="#22d3ee" stroke-width="2.5" filter="url(#g)"/>
<text x="651.8653347947321" y="563.0" font-family="Space Grotesk, Inter, sans-serif" font-size="26" font-weight="700" fill="#22d3ee" text-anchor="middle" letter-spacing="0" opacity="1">3</text>
<text x="723.8653347947321" y="551.0" font-family="Space Grotesk, Inter, sans-serif" font-size="19" font-weight="700" fill="#e8ecff" text-anchor="start" letter-spacing="0" opacity="1">Query</text>
<text x="723.8653347947321" y="573.0" font-family="Space Grotesk, Inter, sans-serif" font-size="14" font-weight="500" fill="#b7c0e6" text-anchor="start" letter-spacing="0" opacity="1">SQL over OCSF / CloudTrail</text>
<path d="M391 645 A 210 210 0 0 1 341 615" fill="none" stroke="#34d399" stroke-width="3" marker-end="url(#a-green)"/>
<circle cx="470" cy="660" r="52" fill="#060a1a" stroke="#34d399" stroke-width="2.5" filter="url(#g)"/>
<text x="470.0" y="668.0" font-family="Space Grotesk, Inter, sans-serif" font-size="26" font-weight="700" fill="#34d399" text-anchor="middle" letter-spacing="0" opacity="1">4</text>
<text x="470.0" y="734.0" font-family="Space Grotesk, Inter, sans-serif" font-size="19" font-weight="700" fill="#e8ecff" text-anchor="middle" letter-spacing="0" opacity="1">Analyze</text>
<text x="470.0" y="756.0" font-family="Space Grotesk, Inter, sans-serif" font-size="14" font-weight="500" fill="#b7c0e6" text-anchor="middle" letter-spacing="0" opacity="1">stack, pivot, baseline</text>
<path d="M262 479 A 210 210 0 0 1 262 421" fill="none" stroke="#ff9900" stroke-width="3" marker-end="url(#a-orange)"/>
<circle cx="288" cy="555" r="52" fill="#060a1a" stroke="#ff9900" stroke-width="2.5" filter="url(#g)"/>
<text x="288.1346652052679" y="563.0" font-family="Space Grotesk, Inter, sans-serif" font-size="26" font-weight="700" fill="#ff9900" text-anchor="middle" letter-spacing="0" opacity="1">5</text>
<text x="216.13466520526788" y="551.0" font-family="Space Grotesk, Inter, sans-serif" font-size="19" font-weight="700" fill="#e8ecff" text-anchor="end" letter-spacing="0" opacity="1">Codify</text>
<text x="216.13466520526788" y="573.0" font-family="Space Grotesk, Inter, sans-serif" font-size="14" font-weight="500" fill="#b7c0e6" text-anchor="end" letter-spacing="0" opacity="1">turn it into a detection</text>
<path d="M341 285 A 210 210 0 0 1 391 255" fill="none" stroke="#fb7185" stroke-width="3" marker-end="url(#a-pink)"/>
<circle cx="288" cy="345" r="52" fill="#060a1a" stroke="#fb7185" stroke-width="2.5" filter="url(#g)"/>
<text x="288.1346652052679" y="353.0" font-family="Space Grotesk, Inter, sans-serif" font-size="26" font-weight="700" fill="#fb7185" text-anchor="middle" letter-spacing="0" opacity="1">6</text>
<text x="216.13466520526788" y="341.0" font-family="Space Grotesk, Inter, sans-serif" font-size="19" font-weight="700" fill="#e8ecff" text-anchor="end" letter-spacing="0" opacity="1">Report</text>
<text x="216.13466520526788" y="363.0" font-family="Space Grotesk, Inter, sans-serif" font-size="14" font-weight="500" fill="#b7c0e6" text-anchor="end" letter-spacing="0" opacity="1">findings or a clean null</text>
<circle cx="470" cy="450" r="92" fill="#a78bfa" fill-opacity=".08" stroke="#a78bfa" stroke-opacity=".4"/>
<text x="470" y="446" font-family="Space Grotesk, Inter, sans-serif" font-size="30" font-weight="700" fill="#e8ecff" text-anchor="middle" letter-spacing="4" opacity="1">HUNT</text>
<text x="470" y="474" font-family="JetBrains Mono, monospace" font-size="15" font-weight="500" fill="#a78bfa" text-anchor="middle" letter-spacing="0" opacity="1">repeat weekly</text>
<rect x="960" y="170" width="600" height="560" rx="22" fill="#a78bfa" fill-opacity=".035" stroke="#a78bfa" stroke-opacity=".45"/>
<text x="980" y="200" font-family="JetBrains Mono, monospace" font-size="14" font-weight="500" fill="#a78bfa" text-anchor="start" letter-spacing="2.5" opacity="1">A GOOD HYPOTHESIS HAS…</text>
<text x="990" y="246" font-family="JetBrains Mono, monospace" font-size="14" font-weight="500" fill="#a78bfa" text-anchor="start" letter-spacing="2" opacity="1">A BEHAVIOR</text>
<text x="990" y="276" font-family="Space Grotesk, Inter, sans-serif" font-size="16" font-weight="500" fill="#e8ecff" text-anchor="start" letter-spacing="0" opacity="1">“A principal reads Secrets Manager values it has never read before…”</text>
<text x="990" y="342" font-family="JetBrains Mono, monospace" font-size="14" font-weight="500" fill="#a78bfa" text-anchor="start" letter-spacing="2" opacity="1">A SCOPE</text>
<text x="990" y="372" font-family="Space Grotesk, Inter, sans-serif" font-size="16" font-weight="500" fill="#e8ecff" text-anchor="start" letter-spacing="0" opacity="1">“…in prod accounts, in the last 7 days…”</text>
<text x="990" y="438" font-family="JetBrains Mono, monospace" font-size="14" font-weight="500" fill="#a78bfa" text-anchor="start" letter-spacing="2" opacity="1">A DATA SOURCE</text>
<text x="990" y="468" font-family="Space Grotesk, Inter, sans-serif" font-size="16" font-weight="500" fill="#e8ecff" text-anchor="start" letter-spacing="0" opacity="1">“…visible in CloudTrail mgmt events (GetSecretValue)…”</text>
<text x="990" y="534" font-family="JetBrains Mono, monospace" font-size="14" font-weight="500" fill="#a78bfa" text-anchor="start" letter-spacing="2" opacity="1">A DISPROOF</text>
<text x="990" y="564" font-family="Space Grotesk, Inter, sans-serif" font-size="16" font-weight="500" fill="#e8ecff" text-anchor="start" letter-spacing="0" opacity="1">“…if every reader is a known CI/CD role, the hypothesis is false.”</text>
<text x="990" y="630" font-family="JetBrains Mono, monospace" font-size="14" font-weight="500" fill="#a78bfa" text-anchor="start" letter-spacing="2" opacity="1">AN ATT&amp;CK ID</text>
<text x="990" y="660" font-family="Space Grotesk, Inter, sans-serif" font-size="16" font-weight="500" fill="#e8ecff" text-anchor="start" letter-spacing="0" opacity="1">T1555.006 · Credentials from Password Stores: Cloud Secrets Mgmt</text>
</svg>