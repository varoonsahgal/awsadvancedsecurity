<text x="40" y="52" font-family="Space Grotesk, Inter, sans-serif" font-size="14" font-weight="600" fill="#fb7185" text-anchor="start" letter-spacing="4">LAB 5.2 · DIGITAL AUTOPSY</text>
<text x="40" y="84" font-family="Space Grotesk, Inter, sans-serif" font-size="22" font-weight="600" fill="#e8ecff" text-anchor="start" >Isolate quietly → capture memory → snapshot → analyze read-only → lock the evidence</text>
<rect x="40" y="120" width="820" height="600" rx="20" fill="#ffffff" fill-opacity=".02" stroke="#a78bfa" stroke-opacity=".6" stroke-width="2"/><text x="60" y="148" font-family="JetBrains Mono, ui-monospace, monospace" font-size="15" font-weight="600" fill="#a78bfa" text-anchor="start" >VPC 10.50.0.0/16</text>
<rect x="64" y="166" width="380" height="530" rx="16" fill="#fb7185" fill-opacity=".05" stroke="#fb7185" stroke-opacity=".5" stroke-dasharray="6 6"/><text x="80" y="192" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" font-weight="600" fill="#fb7185" text-anchor="start" >workload subnet (public)</text>
<rect x="110" y="220" width="290" height="130" rx="14" fill="#fb7185" fill-opacity="0.12" stroke="#fb7185" stroke-opacity=".75" stroke-width="1.6" filter="url(#glow)"/>
<text x="126" y="248" font-family="Space Grotesk, Inter, sans-serif" font-size="17" font-weight="600" fill="#fff" text-anchor="start" >nimbus-web-07 (victim)</text>
<text x="126" y="272" font-family="Space Grotesk, Inter, sans-serif" font-size="14" font-weight="400" fill="#b7c0e6" text-anchor="start" >cron backdoor · rogue SSH key</text>
<text x="126" y="293" font-family="Space Grotesk, Inter, sans-serif" font-size="14" font-weight="400" fill="#b7c0e6" text-anchor="start" >in-RAM implant [kworker/u4:2]</text>
<text x="126" y="314" font-family="Space Grotesk, Inter, sans-serif" font-size="14" font-weight="400" fill="#b7c0e6" text-anchor="start" >termination protection ON</text>
<text x="110" y="390" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="600" fill="#8a95c2" text-anchor="start" letter-spacing="2">SECURITY GROUP SWAP</text>
<rect x="110" y="402" width="118.72" height="26" rx="13" fill="#8a95c2" fill-opacity=".18" stroke="#8a95c2" stroke-opacity=".7"/><text x="169.36" y="420" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="600" fill="#8a95c2" text-anchor="middle" >workload-web</text>
<path d="M250 415 L272 415" fill="none" stroke="#b7c0e6" stroke-width="2"  marker-end="url(#ar)"/>
<rect x="276" y="402" width="86.48" height="26" rx="13" fill="#fbbf24" fill-opacity=".18" stroke="#fbbf24" stroke-opacity=".7"/><text x="319.24" y="420" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="600" fill="#fbbf24" text-anchor="middle" >ir-flush</text>
<path d="M340 430 L340 452" fill="none" stroke="#b7c0e6" stroke-width="2"  marker-end="url(#ar)"/>
<rect x="250" y="456" width="126.78" height="26" rx="13" fill="#fb7185" fill-opacity=".18" stroke="#fb7185" stroke-opacity=".7"/><text x="313.39" y="474" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="600" fill="#fb7185" text-anchor="middle" >ir-quarantine</text>
<text x="110" y="512" font-family="Space Grotesk, Inter, sans-serif" font-size="14" font-weight="400" fill="#b7c0e6" text-anchor="start" >flush = allow-all → flows go untracked;</text>
<text x="110" y="533" font-family="Space Grotesk, Inter, sans-serif" font-size="14" font-weight="400" fill="#b7c0e6" text-anchor="start" >quarantine = no ingress, 443 → endpoints only</text>
<rect x="110" y="560" width="290" height="110" rx="14" fill="#fbbf24" fill-opacity="0.12" stroke="#fbbf24" stroke-opacity=".75" stroke-width="1.6"/>
<text x="126" y="588" font-family="Space Grotesk, Inter, sans-serif" font-size="16" font-weight="600" fill="#fff" text-anchor="start" >Evidence volume (EBS)</text>
<text x="126" y="612" font-family="Space Grotesk, Inter, sans-serif" font-size="14" font-weight="400" fill="#b7c0e6" text-anchor="start" >attached empty, AVML writes</text>
<text x="126" y="633" font-family="Space Grotesk, Inter, sans-serif" font-size="14" font-weight="400" fill="#b7c0e6" text-anchor="start" >memory.lime + sha256 here</text>
<path d="M255 350 L255 378" fill="none" stroke="#fbbf24" stroke-width="2"  marker-end="url(#ar)"/>
<rect x="470" y="166" width="370" height="530" rx="16" fill="#22d3ee" fill-opacity=".05" stroke="#22d3ee" stroke-opacity=".5" stroke-dasharray="6 6"/><text x="486" y="192" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" font-weight="600" fill="#22d3ee" text-anchor="start" >forensics subnet (no route to internet)</text>
<rect x="500" y="220" width="310" height="110" rx="14" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity=".75" stroke-width="1.6"/>
<text x="516" y="248" font-family="Space Grotesk, Inter, sans-serif" font-size="17" font-weight="600" fill="#fff" text-anchor="start" >Interface endpoints</text>
<text x="516" y="272" font-family="Space Grotesk, Inter, sans-serif" font-size="14" font-weight="400" fill="#b7c0e6" text-anchor="start" >ssm · ssmmessages · ec2messages</text>
<text x="516" y="293" font-family="Space Grotesk, Inter, sans-serif" font-size="14" font-weight="400" fill="#b7c0e6" text-anchor="start" >private DNS on → SSM works offline</text>
<rect x="500" y="360" width="310" height="150" rx="14" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity=".75" stroke-width="1.6"/>
<text x="516" y="388" font-family="Space Grotesk, Inter, sans-serif" font-size="17" font-weight="600" fill="#fff" text-anchor="start" >Forensic workstation</text>
<text x="516" y="412" font-family="Space Grotesk, Inter, sans-serif" font-size="14" font-weight="400" fill="#b7c0e6" text-anchor="start" >volumes from snapshots, mounted</text>
<text x="516" y="433" font-family="Space Grotesk, Inter, sans-serif" font-size="14" font-weight="400" fill="#b7c0e6" text-anchor="start" >ro,norecovery,nouuid (XFS)</text>
<text x="516" y="454" font-family="Space Grotesk, Inter, sans-serif" font-size="14" font-weight="400" fill="#b7c0e6" text-anchor="start" >grep -a / strings / Volatility 3</text>
<text x="516" y="475" font-family="Space Grotesk, Inter, sans-serif" font-size="14" font-weight="400" fill="#b7c0e6" text-anchor="start" >write-only access to evidence</text>
<rect x="500" y="540" width="310" height="130" rx="14" fill="#60a5fa" fill-opacity="0.12" stroke="#60a5fa" stroke-opacity=".75" stroke-width="1.6"/>
<text x="516" y="568" font-family="Space Grotesk, Inter, sans-serif" font-size="17" font-weight="600" fill="#fff" text-anchor="start" >S3 gateway endpoint</text>
<text x="516" y="592" font-family="Space Grotesk, Inter, sans-serif" font-size="14" font-weight="400" fill="#b7c0e6" text-anchor="start" >free · route-table based</text>
<text x="516" y="613" font-family="Space Grotesk, Inter, sans-serif" font-size="14" font-weight="400" fill="#b7c0e6" text-anchor="start" >isolation SG egress → S3 prefix list</text>
