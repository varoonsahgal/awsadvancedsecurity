<text x="916" y="192" font-family="Space Grotesk, Inter, sans-serif" font-size="14" font-weight="400" fill="#b7c0e6" text-anchor="start" >ssm send-command</text>
<text x="916" y="213" font-family="Space Grotesk, Inter, sans-serif" font-size="14" font-weight="400" fill="#b7c0e6" text-anchor="start" >ec2 create-snapshots</text>
<text x="916" y="234" font-family="Space Grotesk, Inter, sans-serif" font-size="14" font-weight="400" fill="#b7c0e6" text-anchor="start" >IR role, MFA, logged</text>
<rect x="900" y="310" width="270" height="150" rx="14" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity=".75" stroke-width="1.6"/>
<text x="916" y="338" font-family="Space Grotesk, Inter, sans-serif" font-size="17" font-weight="600" fill="#fff" text-anchor="start" >EBS snapshots</text>
<text x="916" y="362" font-family="Space Grotesk, Inter, sans-serif" font-size="14" font-weight="400" fill="#b7c0e6" text-anchor="start" >root + evidence volumes</text>
<text x="916" y="383" font-family="Space Grotesk, Inter, sans-serif" font-size="14" font-weight="400" fill="#b7c0e6" text-anchor="start" >tagged ir-case=IR-…-007</text>
<text x="916" y="404" font-family="Space Grotesk, Inter, sans-serif" font-size="14" font-weight="400" fill="#b7c0e6" text-anchor="start" >create-volume in the</text>
<text x="916" y="425" font-family="Space Grotesk, Inter, sans-serif" font-size="14" font-weight="400" fill="#b7c0e6" text-anchor="start" >workstation's AZ</text>
<rect x="900" y="500" width="270" height="170" rx="14" fill="#fbbf24" fill-opacity="0.12" stroke="#fbbf24" stroke-opacity=".75" stroke-width="1.6"/>
<text x="916" y="528" font-family="Space Grotesk, Inter, sans-serif" font-size="17" font-weight="600" fill="#fff" text-anchor="start" >Evidence bucket</text>
<text x="916" y="552" font-family="Space Grotesk, Inter, sans-serif" font-size="14" font-weight="400" fill="#b7c0e6" text-anchor="start" >S3 Object Lock (GOVERNANCE)</text>
<text x="916" y="573" font-family="Space Grotesk, Inter, sans-serif" font-size="14" font-weight="400" fill="#b7c0e6" text-anchor="start" >versioned · SSE-KMS</text>
<text x="916" y="594" font-family="Space Grotesk, Inter, sans-serif" font-size="14" font-weight="400" fill="#b7c0e6" text-anchor="start" >chain-of-custody.json</text>
