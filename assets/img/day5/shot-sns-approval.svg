<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-label="Illustrative mock-up: the SOC approval email sent by the playbook via Amazon SNS">
<title>Illustrative mock-up: the SOC approval email sent by the playbook via Amazon SNS</title>
<rect width="1200" height="640" fill="#0d1226"/>
<rect width="1200" height="52" fill="#151b36"/>
<text x="24" y="33" font-family="Inter, Space Grotesk, sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="start" >✉  Inbox · soc-oncall@nimbus.example</text>
<rect x="0" y="52" width="300" height="588" fill="#111733"/>
<rect x="10" y="70" width="280" height="72" rx="8" fill="#23305e"/><text x="24" y="96" font-family="Inter, Space Grotesk, sans-serif" font-size="14" font-weight="600" fill="#fff" text-anchor="start" >AWS Notifications</text><text x="24" y="120" font-family="Inter, Space Grotesk, sans-serif" font-size="13" font-weight="400" fill="#9aa6d1" text-anchor="start" >[SKYFORTRESS IR] Approval…</text><rect x="10" y="152" width="280" height="72" rx="8" fill="#151b36"/><text x="24" y="178" font-family="Inter, Space Grotesk, sans-serif" font-size="14" font-weight="600" fill="#fff" text-anchor="start" >AWS Notifications</text><text x="24" y="202" font-family="Inter, Space Grotesk, sans-serif" font-size="13" font-weight="400" fill="#9aa6d1" text-anchor="start" >[SKYFORTRESS IR] Playbook…</text><rect x="10" y="234" width="280" height="72" rx="8" fill="#151b36"/><text x="24" y="260" font-family="Inter, Space Grotesk, sans-serif" font-size="14" font-weight="600" fill="#fff" text-anchor="start" >PagerDuty</text><text x="24" y="284" font-family="Inter, Space Grotesk, sans-serif" font-size="13" font-weight="400" fill="#9aa6d1" text-anchor="start" >SEV-1 acknowledged</text><rect x="10" y="316" width="280" height="72" rx="8" fill="#151b36"/><text x="24" y="342" font-family="Inter, Space Grotesk, sans-serif" font-size="14" font-weight="600" fill="#fff" text-anchor="start" >Security Hub digest</text><text x="24" y="366" font-family="Inter, Space Grotesk, sans-serif" font-size="13" font-weight="400" fill="#9aa6d1" text-anchor="start" >3 critical exposures</text>
<text x="330" y="96" font-family="Inter, Space Grotesk, sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="start" >[SKYFORTRESS IR] Approval needed: terminate i-0decoy0000000001 (IR-2026-1204-007)</text>
<text x="330" y="128" font-family="Inter, Space Grotesk, sans-serif" font-size="13" font-weight="400" fill="#9aa6d1" text-anchor="start" >From: AWS Notifications &lt;no-reply@sns.amazonaws.com&gt;   To: soc-oncall@nimbus.example   03:44 UTC</text>
<line x1="330" y1="146" x2="1170" y2="146" stroke="#222b55"/>
<rect x="330" y="166" width="840" height="380" rx="10" fill="#0a0e20" stroke="#2a3466"/>
<text x="354" y="200" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" font-weight="400" fill="#e8ecff" text-anchor="start" >Playbook: skyfortress-ec2-compromise-playbook</text><text x="354" y="228" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" font-weight="400" fill="#fb7185" text-anchor="start" >Finding:  Backdoor:EC2/C&amp;CActivity.B!DNS  severity 8.0</text><text x="354" y="256" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" font-weight="400" fill="#e8ecff" text-anchor="start" >Instance: i-0decoy0000000001  →  quarantined, termination-protected</text><text x="354" y="284" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" font-weight="400" fill="#34d399" text-anchor="start" >Evidence: snap-0abc…, snap-0abd…  (tag ir-evidence=true)</text><text x="354" y="312" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" font-weight="400" fill="#e8ecff" text-anchor="start" ></text><text x="354" y="340" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" font-weight="400" fill="#fbbf24" text-anchor="start" >Automation has CONTAINED and PRESERVED. A human must decide:</text><text x="354" y="368" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" font-weight="400" fill="#e8ecff" text-anchor="start" >  approve  →  terminate the instance (snapshots are kept)</text><text x="354" y="396" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" font-weight="400" fill="#e8ecff" text-anchor="start" >  deny     →  keep isolated for forensics</text><text x="354" y="424" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" font-weight="400" fill="#e8ecff" text-anchor="start" ></text><text x="354" y="452" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" font-weight="400" fill="#22d3ee" text-anchor="start" >Lab:  ./approve.sh yes   |   ./approve.sh no</text><text x="354" y="480" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" font-weight="400" fill="#9aa6d1" text-anchor="start" >Prod: use the authenticated approval endpoint. Never forward</text><text x="354" y="508" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" font-weight="400" fill="#9aa6d1" text-anchor="start" >      this email: the task token is a credential.</text>
<rect x="1010" y="604" width="176" height="24" rx="12" fill="#2a1033" stroke="#fb7185" stroke-opacity=".6"/>
<text x="1098" y="621" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12" font-weight="600" fill="#fb7185" text-anchor="middle" >illustrative mock-up</text>
</svg>