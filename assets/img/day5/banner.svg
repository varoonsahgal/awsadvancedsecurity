<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="t d">
  <title id="t">Kraken Rising</title>
  <desc id="d">A colossal crimson kraken rises from a sea of storm clouds to attack the floating Skyfortress while defenders' searchlights pin it in the dark.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05061a"/>
      <stop offset=".45" stop-color="#1a0a2e"/>
      <stop offset=".75" stop-color="#4a0f35"/>
      <stop offset="1" stop-color="#7a1a3a"/>
    </linearGradient>
    <radialGradient id="moon" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffe2d6"/><stop offset=".6" stop-color="#ff9aa8"/><stop offset="1" stop-color="#fb7185" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fb7185" stop-opacity=".45"/><stop offset="1" stop-color="#fb7185" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="krakenSkin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5d8f"/><stop offset=".45" stop-color="#b3174f"/><stop offset="1" stop-color="#3d0626"/>
    </linearGradient>
    <linearGradient id="tent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0336f"/><stop offset="1" stop-color="#4a0a2e"/>
    </linearGradient>
    <radialGradient id="eye" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fffbe0"/><stop offset=".35" stop-color="#ffd43b"/><stop offset=".7" stop-color="#ff9900"/><stop offset="1" stop-color="#ff3d00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b2b5e"/><stop offset="1" stop-color="#120a24"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9dcff"/><stop offset="1" stop-color="#6f74b8"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff6c8" stop-opacity="0"/>
      <stop offset=".25" stop-color="#fff6c8" stop-opacity=".05"/>
      <stop offset="1" stop-color="#fff6c8" stop-opacity=".55"/>
    </linearGradient>
    <radialGradient id="shield" cx=".5" cy="1" r="1">
      <stop offset=".75" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset=".95" stop-color="#22d3ee" stop-opacity=".35"/>
      <stop offset="1" stop-color="#a5f3fc" stop-opacity=".7"/>
    </radialGradient>
    <linearGradient id="cloudA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a2a5e"/><stop offset="1" stop-color="#1b0c26"/>
    </linearGradient>
    <linearGradient id="cloudB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a3a6a"/><stop offset="1" stop-color="#2a0f2e"/>
    </linearGradient>
    <linearGradient id="cloudC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c25a85"/><stop offset=".5" stop-color="#5c1c45"/><stop offset="1" stop-color="#14081c"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="haze"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <!-- sky -->
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <g fill="#fff">
    <circle cx="120" cy="80" r="1.6" opacity=".8"/><circle cx="260" cy="150" r="1.1" opacity=".6"/><circle cx="410" cy="60" r="1.8"/>
    <circle cx="560" cy="130" r="1.2" opacity=".7"/><circle cx="720" cy="40" r="1.5"/><circle cx="880" cy="110" r="1" opacity=".6"/>
    <circle cx="1010" cy="70" r="1.7" opacity=".9"/><circle cx="1180" cy="30" r="1.2"/><circle cx="1320" cy="120" r="1.5" opacity=".7"/>
    <circle cx="1480" cy="60" r="1.9"/><circle cx="1550" cy="170" r="1.1" opacity=".6"/><circle cx="60" cy="230" r="1.3" opacity=".6"/>
    <circle cx="330" cy="260" r="1" opacity=".5"/><circle cx="640" cy="230" r="1.3" opacity=".6"/><circle cx="1400" cy="250" r="1.2" opacity=".5"/>
    <circle cx="980" cy="200" r="1" opacity=".5"/><circle cx="190" cy="330" r="1.1" opacity=".4"/><circle cx="1240" cy="190" r="1.4" opacity=".6"/>
  </g>

  <!-- blood moon -->
  <circle cx="470" cy="250" r="260" fill="url(#moonGlow)"/>
  <circle cx="470" cy="250" r="120" fill="url(#moon)"/>
  <g fill="#c23a5a" opacity=".25"><circle cx="430" cy="220" r="22"/><circle cx="510" cy="280" r="14"/><circle cx="490" cy="205" r="9"/></g>

  <!-- distant clouds -->
  <path d="M0 520 Q120 470 240 510 T480 500 T760 520 T1040 490 T1320 515 T1600 495 V640 H0 Z" fill="url(#cloudA)" opacity=".8"/>

  <!-- lightning -->
  <g filter="url(#glow)" stroke="#ffe7f0" stroke-linejoin="round" fill="none">
    <polyline points="760,0 735,90 770,110 720,220 755,240 700,360" stroke-width="4"/>
    <polyline points="735,90 690,130 700,170" stroke-width="2"/>
    <polyline points="1330,0 1350,70 1320,90 1360,170" stroke-width="3" opacity=".8"/>
  </g>

  <!-- ===================== KRAKEN ===================== -->
  <g>
    <!-- back tentacles -->
    <path d="M180 760 C120 560 220 380 360 330 C430 305 470 360 420 400 C380 432 330 400 350 370" fill="none" stroke="url(#tent)" stroke-width="46" stroke-linecap="round"/>
    <path d="M640 760 C700 600 640 470 560 420" fill="none" stroke="url(#tent)" stroke-width="40" stroke-linecap="round"/>
    <!-- head -->
    <path d="M300 820 C270 640 300 470 430 440 C560 410 650 520 640 700 C636 760 620 800 600 830 Z" fill="url(#krakenSkin)"/>
    <g fill="#ff8fb4" opacity=".22">
      <circle cx="380" cy="520" r="20"/><circle cx="470" cy="490" r="13"/><circle cx="560" cy="540" r="17"/><circle cx="420" cy="600" r="9"/>
    </g>
    <!-- brow ridge -->
    <path d="M330 640 Q460 560 620 630" fill="none" stroke="#2a0418" stroke-width="22" stroke-linecap="round" opacity=".8"/>
    <!-- eyes -->
    <ellipse cx="400" cy="672" rx="44" ry="24" fill="url(#eye)" filter="url(#glow)"/>
    <ellipse cx="560" cy="666" rx="44" ry="24" fill="url(#eye)" filter="url(#glow)"/>
    <ellipse cx="400" cy="672" rx="7" ry="18" fill="#240010"/>
    <ellipse cx="560" cy="666" rx="7" ry="18" fill="#240010"/>
    <!-- front tentacles reaching toward the fortress -->
    <path d="M590 760 C760 700 860 560 960 520 C1040 490 1100 520 1080 580 C1066 620 1020 610 1030 580" fill="none" stroke="url(#tent)" stroke-width="40" stroke-linecap="round"/>
    <path d="M560 800 C760 820 940 700 1060 660" fill="none" stroke="url(#tent)" stroke-width="30" stroke-linecap="round"/>
    <path d="M320 800 C200 720 90 760 60 680 C40 630 90 600 120 640" fill="none" stroke="url(#tent)" stroke-width="34" stroke-linecap="round"/>
    <!-- suckers -->
    <g fill="#ffc2d6" opacity=".55">
      <circle cx="800" cy="650" r="7"/><circle cx="850" cy="610" r="6"/><circle cx="900" cy="565" r="6"/><circle cx="950" cy="535" r="5"/>
      <circle cx="760" cy="790" r="6"/><circle cx="840" cy="770" r="5"/><circle cx="920" cy="740" r="5"/>
      <circle cx="210" cy="730" r="6"/><circle cx="150" cy="740" r="5"/><circle cx="260" cy="440" r="6"/><circle cx="300" cy="380" r="5"/>
    </g>
    <!-- binary rain from the kraken -->
    <g font-family="JetBrains Mono, monospace" font-size="16" fill="#ffd43b" opacity=".55">
      <text x="440" y="480">0x4b52414b454e</text>
      <text x="370" y="760" opacity=".6">AKIA????????????</text>
    </g>
  </g>

  <!-- ===================== SEARCHLIGHTS ===================== -->
  <g filter="url(#haze)">
    <polygon points="1150,455 420,600 470,740" fill="url(#beam)" opacity=".9"/>
    <polygon points="1290,430 520,640 600,770" fill="url(#beam)" opacity=".7"/>
    <polygon points="1380,440 1500,0 1560,0" fill="url(#beam)" opacity=".35"/>
  </g>

  <!-- ===================== SKYFORTRESS ===================== -->
  <g>
    <!-- shield dome -->
    <ellipse cx="1260" cy="470" rx="290" ry="260" fill="url(#shield)"/>
    <path d="M970 470 A290 260 0 0 1 1550 470" fill="none" stroke="#67e8f9" stroke-width="2" stroke-dasharray="6 10" opacity=".7"/>
    <!-- impact crackle where tentacle hits shield -->
    <g stroke="#a5f3fc" stroke-width="2" fill="none" filter="url(#glow)" opacity=".9">
      <path d="M1000 560 l18 -14 l-6 -18 l20 -8"/><path d="M1000 560 l-4 22 l16 10"/><path d="M1000 560 l22 8 l10 -10"/>
    </g>
    <!-- island rock -->
    <path d="M1040 480 L1480 480 L1430 540 L1380 620 L1320 700 L1270 760 L1230 700 L1180 640 L1120 580 Z" fill="url(#rock)"/>
    <path d="M1100 520 L1160 560 M1250 520 L1240 650 M1380 520 L1330 600" stroke="#5c4a8a" stroke-width="3" opacity=".6"/>
    <!-- castle -->
    <g>
      <rect x="1090" y="400" width="340" height="82" fill="url(#wall)"/>
      <path d="M1090 400 h340 v-12 h-20 v12 h-20 v-12 h-20 v12 h-20 v-12 h-20 v12 h-20 v-12 h-20 v12 h-20 v-12 h-20 v12 h-20 v-12 h-20 v12 h-20 v-12 h-20 v12 h-20 v-12 h-20 v12 h-20 v-12 h-20 v12 z" fill="#c7cbf5"/>
      <rect x="1110" y="300" width="60" height="182" fill="url(#wall)"/>
      <polygon points="1100,300 1140,230 1180,300" fill="#7c3aed"/>
      <rect x="1350" y="310" width="60" height="172" fill="url(#wall)"/>
      <polygon points="1340,310 1380,240 1420,310" fill="#7c3aed"/>
      <rect x="1215" y="240" width="90" height="242" fill="url(#wall)"/>
      <polygon points="1200,240 1260,140 1320,240" fill="#a78bfa"/>
      <line x1="1260" y1="140" x2="1260" y2="100" stroke="#e8ecff" stroke-width="3"/>
      <path d="M1260 100 l40 10 l-40 12 z" fill="#ff9900"/>
      <!-- windows -->
      <g fill="#ffcf5c" filter="url(#glow)">
        <rect x="1132" y="330" width="14" height="22" rx="7"/><rect x="1132" y="380" width="14" height="22" rx="7"/>
        <rect x="1372" y="340" width="14" height="22" rx="7"/><rect x="1372" y="390" width="14" height="22" rx="7"/>
        <rect x="1250" y="270" width="20" height="30" rx="10"/><rect x="1250" y="330" width="20" height="30" rx="10"/>
        <rect x="1190" y="430" width="12" height="18" rx="6"/><rect x="1320" y="430" width="12" height="18" rx="6"/>
      </g>
      <!-- gate -->
      <path d="M1240 482 v-40 a20 20 0 0 1 40 0 v40 z" fill="#1b1350"/>
      <!-- searchlight heads -->
      <circle cx="1150" cy="455" r="10" fill="#fff6c8" filter="url(#glow)"/>
      <circle cx="1290" cy="430" r="10" fill="#fff6c8" filter="url(#glow)"/>
      <circle cx="1380" cy="440" r="8" fill="#fff6c8" filter="url(#glow)"/>
    </g>
    <!-- defender drones -->
    <g fill="#22d3ee" filter="url(#glow)">
      <path d="M900 300 l16 6 l-16 6 l4 -6 z"/><path d="M950 250 l16 6 l-16 6 l4 -6 z"/><path d="M1000 330 l16 6 l-16 6 l4 -6 z"/>
    </g>
    <g stroke="#22d3ee" stroke-width="2" opacity=".5" stroke-dasharray="4 6">
      <path d="M916 306 L1100 380"/><path d="M966 256 L1150 350"/>
    </g>
  </g>

  <!-- ===================== FOREGROUND CLOUD SEA ===================== -->
  <path d="M0 760 Q90 700 200 740 Q300 690 420 740 Q520 700 640 750 Q760 700 880 760 Q1000 720 1120 770 Q1240 720 1360 760 Q1480 720 1600 750 V1000 H0 Z" fill="url(#cloudB)"/>
  <path d="M0 850 Q120 790 250 840 Q370 800 500 850 Q630 800 760 860 Q900 810 1040 860 Q1180 820 1310 860 Q1450 815 1600 850 V1000 H0 Z" fill="url(#cloudC)"/>
  <ellipse cx="300" cy="930" rx="380" ry="60" fill="#14081c" opacity=".6" filter="url(#soft)"/>
  <ellipse cx="1250" cy="950" rx="420" ry="60" fill="#14081c" opacity=".6" filter="url(#soft)"/>

  <!-- HUD -->
  <g font-family="Space Grotesk, Inter, sans-serif" fill="#ffe4ec">
    <text x="60" y="940" font-size="22" letter-spacing="8" opacity=".85">DAY 05 · KRAKEN RISING</text>
    <text x="1540" y="940" font-size="18" letter-spacing="4" text-anchor="end" fill="#fb7185">SEV-1 · ALL HANDS ON DECK</text>
  </g>
  <rect x="20" y="20" width="1560" height="960" fill="none" stroke="#fb7185" stroke-opacity=".35" stroke-width="2" rx="18"/>
</svg>
