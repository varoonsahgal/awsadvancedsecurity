<path d="M80 374 H30 V724 H48" fill="none" stroke="#8a95c2" stroke-width="2" marker-end="url(#ar)"/><text x="36" y="640" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="600" fill="#8a95c2" text-anchor="start" >no</text>
<text x="212" y="440" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="600" fill="#fbbf24" text-anchor="start" >yes</text>
<rect x="450" y="120" width="300" height="68" rx="14" fill="#fb7185" fill-opacity="0.12" stroke="#fb7185" stroke-opacity=".75" stroke-width="1.6"/>
<text x="466" y="148" font-family="Space Grotesk, Inter, sans-serif" font-size="16" font-weight="600" fill="#fff" text-anchor="start" >Isolate</text>
<text x="466" y="172" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="400" fill="#b7c0e6" text-anchor="start" >Groups=[ir-quarantine]</text>
<rect x="450" y="230" width="300" height="68" rx="14" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity=".75" stroke-width="1.6"/>
<text x="466" y="258" font-family="Space Grotesk, Inter, sans-serif" font-size="16" font-weight="600" fill="#fff" text-anchor="start" >PreserveEvidence</text>
<text x="466" y="282" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="400" fill="#b7c0e6" text-anchor="start" >ec2:createSnapshots</text>
<rect x="450" y="340" width="300" height="68" rx="14" fill="#60a5fa" fill-opacity="0.12" stroke="#60a5fa" stroke-opacity=".75" stroke-width="1.6"/>
<text x="466" y="368" font-family="Space Grotesk, Inter, sans-serif" font-size="16" font-weight="600" fill="#fff" text-anchor="start" >NotifySOC</text>
<text x="466" y="392" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="400" fill="#b7c0e6" text-anchor="start" >sns:publish</text>
<rect x="450" y="450" width="300" height="110" rx="14" fill="#fbbf24" fill-opacity="0.12" stroke="#fbbf24" stroke-opacity=".75" stroke-width="1.6" filter="url(#glow)"/>
<text x="466" y="478" font-family="Space Grotesk, Inter, sans-serif" font-size="16" font-weight="600" fill="#fff" text-anchor="start" >AwaitHumanApproval</text>
<text x="466" y="502" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="400" fill="#b7c0e6" text-anchor="start" >lambda:invoke.waitForTaskToken</text>
<text x="466" y="523" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="400" fill="#b7c0e6" text-anchor="start" >token → SSM param + SNS</text>
<text x="466" y="544" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="400" fill="#b7c0e6" text-anchor="start" >TimeoutSeconds 3600</text>
<path d="M600.0 606 L720 644 L600.0 682 L480 644 Z" fill="#fbbf24" fill-opacity=".14" stroke="#fbbf24" stroke-width="1.6"/><text x="600.0" y="642" font-family="Space Grotesk, Inter, sans-serif" font-size="16" font-weight="600" fill="#fff" text-anchor="middle" >Approved?</text>
<text x="600.0" y="662" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="400" fill="#b7c0e6" text-anchor="middle" >$.decision.approved</text>
