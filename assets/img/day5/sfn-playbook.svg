<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="t d">
<title id="t">Step Functions auto-remediation playbook</title><desc id="d">EventBridge starts a state machine that parses the finding, branches on severity, tags, protects, isolates, snapshots, notifies, waits for a human task-token approval, then terminates or keeps the instance isolated and issues a receipt.</desc>
<defs>
 <radialGradient id="bg" cx=".2" cy="0" r="1.2"><stop offset="0" stop-color="#2a0f2e"/><stop offset=".55" stop-color="#0b0d24"/><stop offset="1" stop-color="#070914"/></radialGradient>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>
 <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b7c0e6"/></marker>
 <marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#fb7185"/></marker>
 <marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#34d399"/></marker>
 <marker id="arO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff9900"/></marker>
</defs>
<rect width="1200" height="820" rx="22" fill="url(#bg)"/><rect width="1200" height="820" rx="22" fill="url(#grid)"/>
<rect x="1" y="1" width="1198" height="818" rx="21" fill="none" stroke="#fb7185" stroke-opacity=".25"/>
<text x="40" y="52" font-family="Space Grotesk, Inter, sans-serif" font-size="14" font-weight="600" fill="#fb7185" text-anchor="start" letter-spacing="4">LAB 5.3 · AUTOPILOT DEFENSE</text>
<text x="40" y="84" font-family="Space Grotesk, Inter, sans-serif" font-size="22" font-weight="600" fill="#e8ecff" text-anchor="start" >skyfortress-ec2-compromise-playbook — robots contain, humans decide</text>
<rect x="50" y="120" width="300" height="68" rx="14" fill="#ff9900" fill-opacity="0.12" stroke="#ff9900" stroke-opacity=".75" stroke-width="1.6"/>
<text x="66" y="148" font-family="Space Grotesk, Inter, sans-serif" font-size="16" font-weight="600" fill="#fff" text-anchor="start" >EventBridge rule</text>
<text x="66" y="172" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="400" fill="#b7c0e6" text-anchor="start" >GuardDuty Finding, sev ≥ 7</text>
<rect x="50" y="230" width="300" height="68" rx="14" fill="#60a5fa" fill-opacity="0.12" stroke="#60a5fa" stroke-opacity=".75" stroke-width="1.6"/>
<text x="66" y="258" font-family="Space Grotesk, Inter, sans-serif" font-size="16" font-weight="600" fill="#fff" text-anchor="start" >ParseFinding</text>
<text x="66" y="282" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="400" fill="#b7c0e6" text-anchor="start" >Pass → instanceId, caseId</text>
<path d="M200.0 336 L320 374 L200.0 412 L80 374 Z" fill="#fbbf24" fill-opacity=".14" stroke="#fbbf24" stroke-width="1.6"/><text x="200.0" y="372" font-family="Space Grotesk, Inter, sans-serif" font-size="16" font-weight="600" fill="#fff" text-anchor="middle" >IsHighSeverity?</text>
<text x="200.0" y="392" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="400" fill="#b7c0e6" text-anchor="middle" >Choice</text>
