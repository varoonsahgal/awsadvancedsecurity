<text x="66" y="718" font-family="Space Grotesk, Inter, sans-serif" font-size="16" font-weight="600" fill="#fff" text-anchor="start" >LowSeverityNotify</text>
<text x="66" y="742" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="400" fill="#b7c0e6" text-anchor="start" >sns:publish → End</text>
