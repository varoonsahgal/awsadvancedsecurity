<text x="66" y="488" font-family="Space Grotesk, Inter, sans-serif" font-size="16" font-weight="600" fill="#fff" text-anchor="start" >TagForIR</text>
<text x="66" y="512" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="400" fill="#b7c0e6" text-anchor="start" >aws-sdk:ec2:createTags</text>
<rect x="50" y="570" width="300" height="68" rx="14" fill="#fb7185" fill-opacity="0.12" stroke="#fb7185" stroke-opacity=".75" stroke-width="1.6"/>
<text x="66" y="598" font-family="Space Grotesk, Inter, sans-serif" font-size="16" font-weight="600" fill="#fff" text-anchor="start" >ProtectFromTermination</text>
<text x="66" y="622" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="400" fill="#b7c0e6" text-anchor="start" >modifyInstanceAttribute</text>
