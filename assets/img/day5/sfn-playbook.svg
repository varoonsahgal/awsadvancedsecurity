<text x="790" y="550" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="600" fill="#fbbf24" text-anchor="middle" >approve.sh</text>
<rect x="850" y="120" width="300" height="68" rx="14" fill="#fb7185" fill-opacity="0.12" stroke="#fb7185" stroke-opacity=".75" stroke-width="1.6"/>
<text x="866" y="148" font-family="Space Grotesk, Inter, sans-serif" font-size="16" font-weight="600" fill="#fff" text-anchor="start" >RemoveTerminationProtection</text>
<text x="866" y="172" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="400" fill="#b7c0e6" text-anchor="start" >DisableApiTermination=false</text>
<rect x="850" y="230" width="300" height="68" rx="14" fill="#fb7185" fill-opacity="0.12" stroke="#fb7185" stroke-opacity=".75" stroke-width="1.6"/>
<text x="866" y="258" font-family="Space Grotesk, Inter, sans-serif" font-size="16" font-weight="600" fill="#fff" text-anchor="start" >Terminate</text>
<text x="866" y="282" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="400" fill="#b7c0e6" text-anchor="start" >ec2:terminateInstances</text>
<rect x="850" y="340" width="300" height="96" rx="14" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity=".75" stroke-width="1.6" filter="url(#glow)"/>
<text x="866" y="368" font-family="Space Grotesk, Inter, sans-serif" font-size="16" font-weight="600" fill="#fff" text-anchor="start" >IssueReceipt</text>
<text x="866" y="392" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="400" fill="#b7c0e6" text-anchor="start" >lambda:invoke → caseId, evidence,</text>
<text x="866" y="413" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="400" fill="#b7c0e6" text-anchor="start" >approver, outcome (+ flag)</text>
<rect x="850" y="520" width="300" height="68" rx="14" fill="#fb7185" fill-opacity="0.12" stroke="#fb7185" stroke-opacity=".75" stroke-width="1.6"/>
<text x="866" y="548" font-family="Space Grotesk, Inter, sans-serif" font-size="16" font-weight="600" fill="#fff" text-anchor="start" >PlaybookFailed</text>
<text x="866" y="572" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="400" fill="#b7c0e6" text-anchor="start" >Catch States.ALL → sns</text>
<rect x="925" y="640" width="150" height="56" rx="14" fill="#fb7185" fill-opacity="0.12" stroke="#fb7185" stroke-opacity=".75" stroke-width="1.6"/>
<text x="1000.0" y="673.6" font-family="Space Grotesk, Inter, sans-serif" font-size="16" font-weight="600" fill="#fff" text-anchor="middle" >Fail</text>
