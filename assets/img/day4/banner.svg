<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
  <title>Vaults and Thinking Machines — a golden crystalline vault floating above the clouds beside a glowing neural-network robot</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05061a"/><stop offset=".45" stop-color="#1a1240"/><stop offset=".75" stop-color="#4a2350"/><stop offset="1" stop-color="#b8582a"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff3c4"/><stop offset=".25" stop-color="#fbbf24" stop-opacity=".9"/><stop offset=".6" stop-color="#ff9900" stop-opacity=".25"/><stop offset="1" stop-color="#ff9900" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff1b8"/><stop offset=".5" stop-color="#fbbf24"/><stop offset="1" stop-color="#b45309"/></linearGradient>
    <linearGradient id="gold2" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#d97706"/></linearGradient>
    <linearGradient id="gold3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#78350f"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbbf24" stop-opacity="0"/><stop offset=".5" stop-color="#fbbf24" stop-opacity=".35"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/></linearGradient>
    <linearGradient id="robo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b2f6b"/><stop offset="1" stop-color="#0e1030"/></linearGradient>
    <radialGradient id="core" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffffff"/><stop offset=".3" stop-color="#67e8f9"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <linearGradient id="cloudA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6c58a"/><stop offset="1" stop-color="#7a3d5c"/></linearGradient>
    <linearGradient id="cloudB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b3a78"/><stop offset="1" stop-color="#1c1440"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="tiny" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>
  <!-- stars -->
  <g fill="#fff">
    <circle cx="80" cy="60" r="1.6" opacity=".8"/><circle cx="210" cy="140" r="1.2" opacity=".6"/><circle cx="340" cy="40" r="2" opacity=".9"/>
    <circle cx="520" cy="110" r="1.3" opacity=".7"/><circle cx="700" cy="50" r="1.8" opacity=".8"/><circle cx="880" cy="130" r="1.1" opacity=".6"/>
    <circle cx="1040" cy="70" r="2.1" opacity=".9"/><circle cx="1210" cy="30" r="1.4" opacity=".7"/><circle cx="1380" cy="120" r="1.7" opacity=".8"/>
    <circle cx="1530" cy="60" r="1.2" opacity=".6"/><circle cx="150" cy="260" r="1.1" opacity=".5"/><circle cx="1480" cy="240" r="1.3" opacity=".5"/>
    <circle cx="620" cy="220" r="1" opacity=".5"/><circle cx="960" cy="240" r="1.2" opacity=".5"/><circle cx="430" cy="300" r="1" opacity=".4"/>
  </g>
  <!-- distant planet -->
  <circle cx="1390" cy="200" r="70" fill="#3b2a6b"/><circle cx="1370" cy="185" r="70" fill="#5b45a6" opacity=".5"/>
  <ellipse cx="1390" cy="205" rx="120" ry="18" fill="none" stroke="#fbbf24" stroke-opacity=".5" stroke-width="3" transform="rotate(-14 1390 205)"/>

  <!-- sunset glow -->
  <circle cx="800" cy="760" r="520" fill="url(#sun)" opacity=".85"/>

  <!-- far clouds -->
  <g filter="url(#soft)" opacity=".75">
    <ellipse cx="200" cy="720" rx="360" ry="70" fill="#8a4a66"/><ellipse cx="1350" cy="700" rx="380" ry="80" fill="#8a4a66"/>
    <ellipse cx="800" cy="800" rx="700" ry="90" fill="#c06a4a"/>
  </g>

  <!-- light beam from vault -->
  <path d="M560 230 L640 230 L760 1000 L440 1000 Z" fill="url(#beam)" opacity=".6"/>

  <!-- ====== the crystalline vault ====== -->
  <g transform="translate(600 470)">
    <ellipse cx="0" cy="250" rx="220" ry="34" fill="#000" opacity=".25" filter="url(#soft)"/>
    <!-- halo -->
    <circle cx="0" cy="0" r="260" fill="none" stroke="#fbbf24" stroke-opacity=".18" stroke-width="2"/>
    <circle cx="0" cy="0" r="300" fill="none" stroke="#fbbf24" stroke-opacity=".1" stroke-width="1" stroke-dasharray="4 10"/>
    <!-- crystal body (hex prism) -->
    <polygon points="0,-250 150,-150 150,110 0,230 -150,110 -150,-150" fill="url(#gold3)"/>
    <polygon points="0,-250 150,-150 0,-60 -150,-150" fill="url(#gold1)"/>
    <polygon points="-150,-150 0,-60 0,230 -150,110" fill="url(#gold2)" opacity=".92"/>
    <polygon points="150,-150 0,-60 0,230 150,110" fill="url(#gold3)" opacity=".95"/>
    <!-- facet highlights -->
    <polygon points="-150,-150 -90,-112 -90,140 -150,110" fill="#fff" opacity=".12"/>
    <polygon points="0,-60 40,-86 40,200 0,230" fill="#fff" opacity=".08"/>
    <line x1="0" y1="-250" x2="0" y2="-60" stroke="#fff7d6" stroke-width="2" opacity=".8"/>
    <!-- vault door -->
    <g transform="translate(-75 70) skewY(28)">
      <circle cx="0" cy="0" r="58" fill="#7c3a0a" stroke="#fde68a" stroke-width="5"/>
      <circle cx="0" cy="0" r="40" fill="none" stroke="#fde68a" stroke-width="3" stroke-dasharray="6 6"/>
      <g stroke="#fff3c4" stroke-width="6" stroke-linecap="round"><line x1="-22" y1="0" x2="22" y2="0"/><line x1="0" y1="-22" x2="0" y2="22"/></g>
      <circle cx="0" cy="0" r="9" fill="#fff3c4"/>
    </g>
    <!-- key glyph on right face -->
    <g transform="translate(78 40) skewY(-30)" fill="none" stroke="#fff3c4" stroke-width="7" stroke-linecap="round" opacity=".85" filter="url(#tiny)">
      <circle cx="0" cy="-30" r="18"/><line x1="0" y1="-12" x2="0" y2="50"/><line x1="0" y1="30" x2="16" y2="30"/><line x1="0" y1="46" x2="12" y2="46"/>
    </g>
    <!-- orbiting key shards -->
    <g filter="url(#glow)">
      <polygon points="-250,-40 -232,-60 -214,-40 -232,-20" fill="#fde68a"/>
      <polygon points="238,-110 252,-126 266,-110 252,-94" fill="#fbbf24"/>
      <polygon points="200,190 212,176 224,190 212,204" fill="#ff9900"/>
    </g>
    <!-- lattice rune text -->
    <text x="0" y="-120" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="18" fill="#7c2d12" opacity=".7">AES-256-GCM</text>
    <text x="-70" y="-12" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#fff7d6" opacity=".8" transform="skewY(30)">ML-KEM-768</text>
  </g>

  <!-- ====== neural robot ====== -->
  <g transform="translate(1110 520)">
    <ellipse cx="0" cy="330" rx="170" ry="26" fill="#000" opacity=".25" filter="url(#soft)"/>
    <!-- body -->
    <path d="M-120 120 Q-130 300 -60 320 L60 320 Q130 300 120 120 Q0 80 -120 120 Z" fill="url(#robo)" stroke="#67e8f9" stroke-opacity=".5" stroke-width="2"/>
    <circle cx="0" cy="210" r="36" fill="url(#core)" filter="url(#glow)"/>
    <circle cx="0" cy="210" r="24" fill="none" stroke="#fff" stroke-width="2" opacity=".7"/>
    <!-- neck -->
    <rect x="-24" y="80" width="48" height="40" rx="8" fill="#191c4a" stroke="#67e8f9" stroke-opacity=".4"/>
    <!-- head dome (transparent brain) -->
    <path d="M-150 20 Q-150 -190 0 -190 Q150 -190 150 20 Q150 92 0 92 Q-150 92 -150 20 Z" fill="#0f1a4a" fill-opacity=".75" stroke="#67e8f9" stroke-width="3"/>
    <path d="M-120 -40 Q-110 -160 0 -168" stroke="#fff" stroke-opacity=".35" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- neural net -->
    <g stroke="#67e8f9" stroke-width="2" opacity=".75">
      <line x1="-90" y1="-90" x2="-20" y2="-130"/><line x1="-90" y1="-90" x2="-30" y2="-50"/><line x1="-20" y1="-130" x2="50" y2="-110"/>
      <line x1="-30" y1="-50" x2="50" y2="-110"/><line x1="-30" y1="-50" x2="40" y2="-30"/><line x1="50" y1="-110" x2="100" y2="-60"/>
      <line x1="40" y1="-30" x2="100" y2="-60"/><line x1="-90" y1="-90" x2="-100" y2="-10"/><line x1="-100" y1="-10" x2="-30" y2="-50"/>
      <line x1="-100" y1="-10" x2="-20" y2="20"/><line x1="-20" y1="20" x2="40" y2="-30"/><line x1="40" y1="-30" x2="90" y2="10"/><line x1="100" y1="-60" x2="90" y2="10"/>
    </g>
    <g fill="#a5f3fc" filter="url(#tiny)">
      <circle cx="-90" cy="-90" r="8"/><circle cx="-20" cy="-130" r="7"/><circle cx="50" cy="-110" r="9"/><circle cx="-30" cy="-50" r="10" fill="#fbbf24"/>
      <circle cx="40" cy="-30" r="8"/><circle cx="100" cy="-60" r="7"/><circle cx="-100" cy="-10" r="6"/><circle cx="-20" cy="20" r="7"/><circle cx="90" cy="10" r="6"/>
    </g>
    <!-- visor -->
    <path d="M-110 30 Q0 0 110 30 L100 64 Q0 44 -100 64 Z" fill="#22d3ee" opacity=".85" filter="url(#glow)"/>
    <circle cx="-44" cy="44" r="7" fill="#fff"/><circle cx="44" cy="44" r="7" fill="#fff"/>
    <!-- arms holding a leash (the policy) -->
    <path d="M-120 140 Q-200 200 -260 170" stroke="#2b2f6b" stroke-width="30" fill="none" stroke-linecap="round"/>
    <path d="M120 140 Q180 210 160 280" stroke="#2b2f6b" stroke-width="30" fill="none" stroke-linecap="round"/>
    <!-- golden leash/policy chain connecting robot to vault -->
    <path d="M-262 170 Q-330 120 -360 40" stroke="#fbbf24" stroke-width="5" fill="none" stroke-dasharray="14 8" filter="url(#tiny)"/>
    <!-- antenna -->
    <line x1="0" y1="-190" x2="0" y2="-240" stroke="#67e8f9" stroke-width="4"/><circle cx="0" cy="-248" r="12" fill="#fbbf24" filter="url(#glow)"/>
  </g>

  <!-- cedar policy scroll floating -->
  <g transform="translate(1290 260) rotate(8)">
    <rect x="-110" y="-60" width="220" height="120" rx="14" fill="#140f2e" fill-opacity=".85" stroke="#fbbf24" stroke-width="2"/>
    <text x="-92" y="-28" font-family="JetBrains Mono, monospace" font-size="16" fill="#f0abfc">forbid<tspan fill="#a5b4fc">(</tspan></text>
    <text x="-76" y="-4" font-family="JetBrains Mono, monospace" font-size="15" fill="#93c5fd">action == <tspan fill="#86efac">"exfil"</tspan></text>
    <text x="-92" y="22" font-family="JetBrains Mono, monospace" font-size="16" fill="#a5b4fc">);</text>
    <text x="-92" y="46" font-family="JetBrains Mono, monospace" font-size="13" fill="#6b76a8">// cedar says no</text>
  </g>

  <!-- near clouds -->
  <g>
    <path d="M0 860 Q80 780 180 820 Q240 740 340 790 Q420 740 500 800 Q580 770 640 830 Q720 800 780 860 L780 1000 L0 1000 Z" fill="url(#cloudA)" opacity=".9"/>
    <path d="M700 880 Q780 800 880 840 Q950 770 1060 820 Q1140 760 1240 820 Q1320 790 1400 840 Q1500 800 1600 850 L1600 1000 L700 1000 Z" fill="url(#cloudA)" opacity=".85"/>
    <path d="M0 930 Q120 870 260 910 Q380 860 520 910 Q680 870 820 920 Q980 870 1140 920 Q1300 880 1460 920 Q1540 900 1600 920 L1600 1000 L0 1000 Z" fill="url(#cloudB)"/>
  </g>
  <!-- kraken tentacle sneaking from clouds -->
  <path d="M1540 1000 Q1500 900 1530 860 Q1560 820 1520 790 Q1490 770 1500 750" stroke="#c0265e" stroke-width="26" fill="none" stroke-linecap="round" opacity=".9"/>
  <g fill="#ffb3cb" opacity=".7"><circle cx="1514" cy="900" r="5"/><circle cx="1528" cy="860" r="4.5"/><circle cx="1520" cy="815" r="4"/></g>

  <!-- title watermark -->
  <text x="60" y="960" font-family="Space Grotesk, Inter, sans-serif" font-size="22" letter-spacing="8" fill="#fff" opacity=".55">DAY 04 · VAULTS &amp; THINKING MACHINES</text>
</svg>
