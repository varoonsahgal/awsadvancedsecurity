  <radialGradient id="sun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff4c2"/><stop offset=".4" stop-color="#fbbf24"/><stop offset="1" stop-color="#ff9900" stop-opacity="0"/></radialGradient>
