<!-- cedar tree -->
<g transform="translate(1440 400)">
  <rect x="-12" y="-40" width="24" height="60" fill="#3b1f12"/>
  <path d="M0 -300 L-60 -200 L-30 -200 L-90 -110 L-50 -110 L-120 -30 L120 -30 L50 -110 L90 -110 L30 -200 L60 -200 Z" fill="#14532d" stroke="#34d399" stroke-width="3"/>
