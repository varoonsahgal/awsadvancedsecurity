  <text x="0" y="-60" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="16" fill="#bbf7d0">permit · when</text>
</g>
<!-- gateway arch -->
<g transform="translate(1120 410)">
  <path d="M-150 0 V-190 A150 150 0 0 1 150 -190 V0" fill="none" stroke="url(#gold)" stroke-width="18"/>
