  <path d="M-90 -30 q-40 -20 -30 -60" stroke="url(#gold)" stroke-width="8" fill="none" stroke-linecap="round"/>
  <rect x="50" y="-46" width="50" height="14" rx="6" fill="#ff9900"/>
</g>
<!-- leash -->
<path d="M960 320 C1020 340 1040 280 1100 300 C1150 316 1180 360 1230 330" fill="none" stroke="#ff9900" stroke-width="6" filter="url(#glow)"/>
<g font-family="JetBrains Mono, ui-monospace, monospace" font-size="15" fill="#fde68a"><text x="600" y="215">amount ≤ 500 ✓</text><text x="600" y="250" fill="#fecdd3">export_customer_data ✗</text></g>
<g opacity="0.8">
  <ellipse cx="800" cy="490" rx="900" ry="70" fill="#5b2350" filter="url(#soft)"/>
