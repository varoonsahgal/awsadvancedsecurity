</g>
<rect width="1600" height="500" fill="url(#fadeL)"/>
<text x="70" y="330" font-family="JetBrains Mono, ui-monospace, monospace" font-size="22" letter-spacing="6" fill="#fbbf24">LAB 4.4 · CEDAR · AGENTCORE POLICY</text>
<text x="68" y="392" font-family="Space Grotesk, Inter, sans-serif" font-size="64" font-weight="700" fill="#fff">Leash the Agent 🦮</text>
<text x="70" y="432" font-family="Space Grotesk, Inter, sans-serif" font-size="24" fill="#f3d9b1" opacity=".9">Default deny. Forbid wins. The prompt can't argue with the Gateway.</text></svg>
