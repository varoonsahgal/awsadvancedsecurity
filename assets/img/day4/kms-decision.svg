<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660">
  <title>How KMS decides: key policy, IAM policies, grants, and organization guardrails</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0f26"/><stop offset="1" stop-color="#16101f"/></linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#b7c0e6"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#34d399"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#fb7185"/></marker>
    <style>
      text { font-family: "Space Grotesk", Inter, sans-serif; fill: #e8ecff; }
      .h { font-size: 22px; font-weight: 700; }
      .t { font-size: 17px; font-weight: 600; }
      .s { font-size: 14px; fill: #b7c0e6; }
      .m { font-family: "JetBrains Mono", monospace; font-size: 13px; fill: #86efac; }
      .y { fill: #34d399; font-size: 14px; font-weight: 700; }
      .n { fill: #fb7185; font-size: 14px; font-weight: 700; }
    </style>
  </defs>
  <rect width="1200" height="660" fill="url(#bg)"/>
  <text x="40" y="50" class="h" style="fill:#fbbf24">HOW KMS SAYS YES</text>
  <text x="40" y="78" class="s">The key policy is the root of trust. IAM policies only count if the key policy delegates to the account.</text>

  <!-- request -->
  <rect x="40" y="120" width="230" height="86" rx="16" fill="#1a2350" stroke="#60a5fa" stroke-width="2"/>
  <text x="60" y="152" class="t">kms:Decrypt</text>
  <text x="60" y="178" class="s">role/dojo-app · EC · VPCe</text>

  <!-- step 1 org -->
  <rect x="330" y="110" width="250" height="106" rx="16" fill="#1d1430" stroke="#a78bfa" stroke-width="2"/>
  <text x="350" y="142" class="t" style="fill:#c4b5fd">① SCP + RCP</text>
  <text x="350" y="166" class="s">org guardrails: explicit Deny</text>
  <text x="350" y="188" class="s">anywhere = game over</text>
  <path d="M270 163 L326 163" stroke="#b7c0e6" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- step 2 key policy -->
  <rect x="640" y="110" width="270" height="106" rx="16" fill="#2a1d0c" stroke="#fbbf24" stroke-width="3"/>
  <text x="660" y="142" class="t" style="fill:#fbbf24">② Key policy</text>
  <text x="660" y="166" class="s">Does it allow the principal</text>
  <text x="660" y="188" class="s">directly — or delegate to :root?</text>
  <path d="M580 163 L636 163" stroke="#b7c0e6" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- branches -->
  <path d="M775 216 L775 268 L480 268 L480 300" stroke="#b7c0e6" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M775 216 L775 300" stroke="#b7c0e6" stroke-width="2" marker-end="url(#a)"/>
  <path d="M775 216 L775 268 L1060 268 L1060 300" stroke="#b7c0e6" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <rect x="330" y="304" width="300" height="120" rx="16" fill="#132238" stroke="#22d3ee" stroke-width="2"/>
  <text x="350" y="336" class="t" style="fill:#67e8f9">③a Direct allow</text>
  <text x="350" y="360" class="s">Statement names the role ARN.</text>
  <text x="350" y="382" class="s">Conditions must match, e.g.</text>
  <text x="350" y="404" class="m">kms:EncryptionContext:project</text>

  <rect x="650" y="304" width="250" height="120" rx="16" fill="#132238" stroke="#22d3ee" stroke-width="2"/>
  <text x="670" y="336" class="t" style="fill:#67e8f9">③b Via :root</text>
  <text x="670" y="360" class="s">"arn:…:root" + kms:* means</text>
  <text x="670" y="382" class="s">IAM policies in that account</text>
  <text x="670" y="404" class="s">must ALSO allow it</text>

  <rect x="920" y="304" width="250" height="120" rx="16" fill="#132238" stroke="#22d3ee" stroke-width="2"/>
  <text x="940" y="336" class="t" style="fill:#67e8f9">③c Grant</text>
  <text x="940" y="360" class="s">CreateGrant → grantee +</text>
  <text x="940" y="382" class="s">operations + constraints</text>
  <text x="940" y="404" class="m">EncryptionContextSubset</text>

  <!-- outcomes -->
  <path d="M480 424 L480 482" stroke="#34d399" stroke-width="2.5" marker-end="url(#ag)"/>
  <path d="M775 424 L775 482" stroke="#34d399" stroke-width="2.5" marker-end="url(#ag)"/>
  <path d="M1045 424 L1045 482" stroke="#34d399" stroke-width="2.5" marker-end="url(#ag)"/>
  <rect x="330" y="486" width="840" height="64" rx="16" fill="#0f2a22" stroke="#34d399" stroke-width="2"/>
  <text x="750" y="526" text-anchor="middle" class="t" style="fill:#34d399">✓ ALLOW — and CloudTrail logs the key ARN, principal, EC and source VPC endpoint</text>

  <!-- deny lane -->
  <rect x="40" y="304" width="230" height="246" rx="16" fill="#2a0f1c" stroke="#fb7185" stroke-width="2"/>
  <text x="60" y="338" class="t" style="fill:#fb7185">✗ DENY if…</text>
  <text x="60" y="368" class="s">• any explicit Deny (SCP,</text>
  <text x="60" y="390" class="s">   RCP, key policy, IAM)</text>
  <text x="60" y="418" class="s">• key policy is silent and</text>
  <text x="60" y="440" class="s">   doesn't delegate to :root</text>
  <text x="60" y="468" class="s">• key disabled / pending</text>
  <text x="60" y="490" class="s">   deletion</text>
  <text x="60" y="518" class="s">• EC mismatch → Invalid-</text>
  <text x="60" y="540" class="s">   CiphertextException</text>
  <path d="M455 216 Q400 260 274 330" stroke="#fb7185" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#ar)"/>

  <text x="40" y="604" class="s">Cross-account? The key policy in account A must allow account B AND an IAM policy in B must allow the call. Both sides, always.</text>
  <text x="40" y="630" class="s">kms:ViaService = "s3.us-east-1.amazonaws.com" restricts a key to use only through S3 — not direct API calls.</text>
</svg>
