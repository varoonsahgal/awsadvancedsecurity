<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" font-family="Space Grotesk, Inter, sans-serif">
  <title>Lab 0 cover: a crane lays glowing blueprint foundations for the fortress on a floating island at night</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b0f2e"/><stop offset="1" stop-color="#1b1450"/></linearGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b2f86"/><stop offset="1" stop-color="#0b0824"/></linearGradient>
    <linearGradient id="bp" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="crane" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc35c"/><stop offset="1" stop-color="#ff8a00"/></linearGradient>
    <filter id="g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="24"/></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#22d3ee" stroke-opacity=".12"/></pattern>
  </defs>
  <rect width="1600" height="500" fill="url(#sky)"/>
  <rect width="1600" height="500" fill="url(#grid)"/>
  <g fill="#fff"><circle cx="90" cy="60" r="1.6"/><circle cx="300" cy="120" r="1.2"/><circle cx="520" cy="40" r="1.8"/><circle cx="1180" cy="70" r="1.4"/><circle cx="1400" cy="150" r="1.8"/><circle cx="1520" cy="50" r="1.2"/><circle cx="760" cy="30" r="1"/></g>
  <circle cx="1380" cy="110" r="46" fill="#fde68a" opacity=".85" filter="url(#g)"/>
  <ellipse cx="800" cy="470" rx="900" ry="80" fill="#4f46e5" opacity=".35" filter="url(#soft)"/>
  <!-- island -->
  <path d="M440 330 C480 312 1120 312 1160 330 C1140 370 1060 400 990 430 C900 470 700 470 610 430 C540 400 460 370 440 330 Z" fill="url(#rock)"/>
  <path d="M440 330 C480 312 1120 312 1160 330 C1120 322 480 322 440 330 Z" fill="#34d399"/>
  <g fill="#22d3ee" filter="url(#g)"><path d="M700 380 l8 -16 l8 16 l-8 12 z"/><path d="M900 390 l7 -14 l7 14 l-7 10 z" fill="#f472b6"/></g>
  <!-- blueprint outline of fortress -->
  <g fill="none" stroke="url(#bp)" stroke-width="3" stroke-dasharray="10 7" filter="url(#g)">
    <rect x="620" y="210" width="360" height="110"/>
    <rect x="740" y="120" width="120" height="200"/>
    <path d="M728 122 L800 40 L872 122"/>
    <rect x="640" y="160" width="60" height="160"/><path d="M632 162 L670 112 L708 162"/>
    <rect x="900" y="160" width="60" height="160"/><path d="M892 162 L930 112 L968 162"/>
  </g>
  <!-- placed foundation blocks -->
  <g>
    <rect x="620" y="290" width="360" height="30" fill="#6366f1"/>
    <g fill="#818cf8" stroke="#1e1b4b" stroke-width="2">
      <rect x="620" y="290" width="60" height="30"/><rect x="680" y="290" width="60" height="30"/><rect x="740" y="290" width="60" height="30"/>
      <rect x="800" y="290" width="60" height="30"/><rect x="860" y="290" width="60" height="30"/><rect x="920" y="290" width="60" height="30"/>
      <rect x="650" y="260" width="60" height="30"/><rect x="710" y="260" width="60" height="30"/><rect x="770" y="260" width="60" height="30"/>
    </g>
    <g font-size="12" font-weight="700" fill="#e0e7ff" text-anchor="middle">
      <text x="650" y="310">ORG</text><text x="710" y="310">SCP</text><text x="770" y="310">RCP</text><text x="830" y="310">OUs</text><text x="890" y="310">IdC</text><text x="950" y="310">$25</text>
      <text x="680" y="280">dev</text><text x="740" y="280">prod</text><text x="800" y="280">CLI</text>
    </g>
  </g>
  <!-- crane -->
  <g>
    <rect x="1080" y="60" width="18" height="270" fill="url(#crane)"/>
    <path d="M1080 330 l9 -270 l9 270" fill="none" stroke="#7c2d12" stroke-width="2" opacity=".5"/>
    <rect x="860" y="56" width="330" height="14" fill="url(#crane)"/>
    <path d="M1089 56 L1089 20 L1190 56 M1089 20 L880 56" stroke="#ffc35c" stroke-width="3" fill="none"/>
    <rect x="1160" y="70" width="40" height="30" fill="#ff8a00"/>
    <line x1="890" y1="70" x2="890" y2="200" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="860" y="200" width="60" height="30" fill="#a78bfa" stroke="#1e1b4b" stroke-width="2" filter="url(#g)"/>
    <text x="890" y="220" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">BPA</text>
  </g>
  <!-- owl supervisor -->
  <g transform="translate(530 250)" filter="url(#g)">
    <path d="M0 -50 L40 -34 V0 C40 30 20 46 0 54 C-20 46 -40 30 -40 0 V-34 Z" fill="#0b1028" stroke="url(#bp)" stroke-width="4"/>
    <rect x="-13" y="-6" width="26" height="22" rx="4" fill="#22d3ee"/><path d="M-8 -6 v-8 a8 8 0 0 1 16 0 v8" stroke="#22d3ee" stroke-width="4" fill="none"/>
  </g>
  <!-- title -->
  <text x="80" y="110" font-size="20" letter-spacing="6" fill="#22d3ee">LAB 0</text>
  <text x="80" y="160" font-size="52" font-weight="700" fill="#fff">Foundations</text>
  <text x="80" y="210" font-size="20" fill="#b7c0e6">org · accounts · profiles · budgets</text>
  <!-- clouds -->
  <g fill="#c7d2fe" opacity=".55">
    <path d="M0 470 C60 420 160 430 190 455 C240 420 330 430 360 470 L360 500 L0 500 Z"/>
    <path d="M1240 470 C1290 420 1390 425 1420 455 C1470 425 1560 430 1600 465 L1600 500 L1240 500 Z"/>
  </g>
</svg>
