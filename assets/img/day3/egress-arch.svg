<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="Space Grotesk, Inter, sans-serif">
  <title>Egress inspection architecture: private subnet routes through AWS Network Firewall to a NAT gateway, DNS goes through Route 53 Resolver DNS Firewall</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#34d399"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#fb7185"/></marker>
    <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#22d3ee"/></marker>
    <filter id="g" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="fw" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#065f46"/><stop offset="1" stop-color="#064e3b"/></linearGradient>
  </defs>
  <rect width="1200" height="720" fill="#060b18"/>
  <text x="40" y="48" fill="#34d399" font-size="15" letter-spacing="3">FIG 3.1 · EGRESS INSPECTION, SINGLE-AZ LAB TOPOLOGY</text>

  <!-- Internet -->
  <rect x="980" y="80" width="190" height="250" rx="18" fill="#0b1328" stroke="#334155"/>
  <text x="1075" y="110" fill="#e2e8f0" font-size="18" text-anchor="middle" font-weight="600">Internet</text>
  <g font-size="15">
    <text x="1000" y="150" fill="#34d399">✓ *.amazonaws.com</text>
    <text x="1000" y="178" fill="#34d399">✓ *.amazonlinux.com</text>
    <text x="1000" y="214" fill="#fb7185">✗ example.com</text>
    <text x="1000" y="242" fill="#fb7185">✗ 8.8.8.8 :53</text>
    <text x="1000" y="270" fill="#fb7185">✗ dns.google (DoH)</text>
    <text x="1000" y="306" fill="#94a3b8" font-size="14">anything not allow-listed</text>
  </g>

  <!-- VPC -->
  <rect x="30" y="70" width="920" height="620" rx="22" fill="none" stroke="#34d399" stroke-opacity=".6" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="54" y="100" fill="#34d399" font-size="16" font-weight="600">VPC 10.66.0.0/16 · skyfortress-egress-vpc</text>

  <!-- IGW -->
  <rect x="860" y="180" width="90" height="56" rx="10" fill="#0f172a" stroke="#ff9900"/>
  <text x="905" y="214" fill="#ffb347" font-size="16" text-anchor="middle">IGW</text>
  <path d="M950 208 H978" stroke="#34d399" stroke-width="3" marker-end="url(#a)"/>

  <!-- public subnet -->
  <rect x="610" y="130" width="230" height="170" rx="14" fill="#0b1a2e" stroke="#60a5fa" stroke-opacity=".6"/>
  <text x="626" y="156" fill="#93c5fd" font-size="15">Public subnet 10.66.0.0/24</text>
  <rect x="650" y="176" width="150" height="60" rx="10" fill="#132a4a" stroke="#60a5fa"/>
  <text x="725" y="212" fill="#e2e8f0" font-size="17" text-anchor="middle">NAT gateway</text>
  <text x="626" y="262" fill="#94a3b8" font-size="14">RT: 0.0.0.0/0 → igw</text>
  <text x="626" y="284" fill="#ffb347" font-size="14">RT: 10.66.2.0/24 → vpce-fw ⟲</text>
  <path d="M800 206 H858" stroke="#34d399" stroke-width="3" marker-end="url(#a)"/>

  <!-- firewall subnet -->
  <rect x="330" y="130" width="250" height="300" rx="14" fill="url(#fw)" stroke="#34d399" filter="url(#g)"/>
  <text x="346" y="156" fill="#a7f3d0" font-size="15">Firewall subnet 10.66.1.0/28</text>
  <text x="455" y="190" fill="#ecfdf5" font-size="19" text-anchor="middle" font-weight="700">Network Firewall</text>
  <text x="455" y="212" fill="#a7f3d0" font-size="14" text-anchor="middle">endpoint vpce-fw · STRICT_ORDER</text>
  <g font-size="14">
    <rect x="348" y="228" width="214" height="44" rx="8" fill="#022c22" stroke="#34d399" stroke-opacity=".6"/>
    <text x="358" y="246" fill="#ecfdf5">P10 sky-egress-guard</text>
    <text x="358" y="264" fill="#86efac">drop :53/:853 out · alert UA</text>
    <rect x="348" y="280" width="214" height="44" rx="8" fill="#022c22" stroke="#34d399" stroke-opacity=".6"/>
    <text x="358" y="298" fill="#ecfdf5">P20 domain allow-list</text>
    <text x="358" y="316" fill="#86efac">TLS_SNI + HTTP_HOST</text>
    <rect x="348" y="332" width="214" height="44" rx="8" fill="#3b0d1a" stroke="#fb7185" stroke-opacity=".7"/>
    <text x="358" y="350" fill="#fecdd3">default</text>
    <text x="358" y="368" fill="#fda4af">drop_established + alert</text>
  </g>
  <text x="346" y="410" fill="#a7f3d0" font-size="14">RT: 0.0.0.0/0 → nat</text>
  <path d="M580 206 H648" stroke="#34d399" stroke-width="3" marker-end="url(#a)"/>

  <!-- private subnet -->
  <rect x="60" y="130" width="240" height="300" rx="14" fill="#0b1a2e" stroke="#a78bfa" stroke-opacity=".6"/>
  <text x="76" y="156" fill="#c4b5fd" font-size="15">Private subnet 10.66.2.0/24</text>
  <rect x="90" y="180" width="180" height="90" rx="12" fill="#1e1b4b" stroke="#a78bfa"/>
  <text x="180" y="210" fill="#ede9fe" font-size="16" text-anchor="middle">nimbus-cargo-box-07</text>
  <text x="180" y="234" fill="#fda4af" font-size="14" text-anchor="middle">🐙 kraken-implant</text>
  <text x="180" y="256" fill="#94a3b8" font-size="13" text-anchor="middle">IMDSv2 · SSM only</text>
  <text x="76" y="300" fill="#94a3b8" font-size="14" text-decoration="line-through">RT: 0.0.0.0/0 → nat</text>
  <text x="76" y="322" fill="#ffb347" font-size="14">RT: 0.0.0.0/0 → vpce-fw</text>
  <path d="M270 206 H328" stroke="#34d399" stroke-width="3" marker-end="url(#a)"/>

  <!-- rogue DNS path dropped -->
  <path d="M230 270 C300 330 360 330 380 300" stroke="#fb7185" stroke-width="2.5" fill="none" stroke-dasharray="6 5" marker-end="url(#ar)"/>
  <text x="200" y="352" fill="#fb7185" font-size="14">dig @8.8.8.8 → dropped</text>

  <!-- resolver -->
  <rect x="60" y="470" width="520" height="190" rx="14" fill="#06202a" stroke="#22d3ee"/>
  <text x="80" y="500" fill="#67e8f9" font-size="18" font-weight="600">Route 53 Resolver (10.66.0.2) + DNS Firewall</text>
  <g font-size="14">
    <text x="80" y="530" fill="#e0f2fe">P100  *.kraken-c2.example → BLOCK · OVERRIDE CNAME sinkhole.skyfortress.lab</text>
    <text x="80" y="556" fill="#e0f2fe">P200  AWSManagedDomainsAggregateThreatList → BLOCK NXDOMAIN</text>
    <text x="80" y="582" fill="#e0f2fe">P300  Advanced: DNS_TUNNELING / DGA (confidence threshold)</text>
    <text x="80" y="616" fill="#94a3b8">Never leaves the VPC through the firewall — DNS Firewall is the only</text>
    <text x="80" y="636" fill="#94a3b8">place you can see and stop it. That's why rogue resolvers must be dropped.</text>
  </g>
  <path d="M150 270 V466" stroke="#22d3ee" stroke-width="3" marker-end="url(#ac)"/>
  <text x="160" y="450" fill="#67e8f9" font-size="14">DNS (VPC+2)</text>

  <!-- logs -->
  <rect x="620" y="470" width="310" height="190" rx="14" fill="#111827" stroke="#ff9900" stroke-opacity=".7"/>
  <text x="640" y="500" fill="#ffb347" font-size="18" font-weight="600">Evidence → CloudWatch Logs</text>
  <g font-size="14" fill="#fde68a">
    <text x="640" y="532">/skyfortress/nfw/alert</text>
    <text x="640" y="556">/skyfortress/nfw/flow</text>
    <text x="640" y="580">/skyfortress/dns/query</text>
  </g>
  <text x="640" y="616" fill="#94a3b8" font-size="14">query logs carry firewall_rule_action,</text>
  <text x="640" y="636" fill="#94a3b8" font-size="14">query_name, srcaddr — your hunting ground</text>
  <path d="M455 430 C470 460 560 480 618 520" stroke="#ff9900" stroke-width="2" fill="none" stroke-dasharray="4 4" marker-end="url(#a)"/>
  <path d="M580 600 H616" stroke="#ff9900" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#a)"/>
</svg>
