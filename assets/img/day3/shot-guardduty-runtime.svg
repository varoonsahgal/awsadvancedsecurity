e</text><text x="290" y="560" font-family="Inter, Space Grotesk, sans-serif" font-size="13.5" font-weight="400" fill="#e6ebff" text-anchor="start" opacity="1">  pod can roll up into a critical attack sequence.</text><text x="290" y="590" font-family="Inter, Space Grotesk, sans-serif" font-size="13.5" font-weight="400" fill="#e6ebff" text-anchor="start" opacity="1">• Since Oct 2026 Runtime Monitoring is part of the</text><text x="290" y="620" font-family="Inter, Space Grotesk, sans-serif" font-size="13.5" font-weight="400" fill="#e6ebff" text-anchor="start" opacity="1">  Security Hub Threat Analytics plan.</text><text x="290" y="650" font-family="Inter, Space Grotesk, sans-serif" font-size="13.5" font-weight="400" fill="#e6ebff" text-anchor="start" opacity="1"></text><text x="290" y="680" font-family="Inter, Space Grotesk, sans-serif" font-size="13.5" font-weight="400" fill="#8f9bc8" text-anchor="start" opacity="1">Test domain: guarddutyc2activityb.com is published</text><text x="290" y="710" font-family="Inter, Space Grotesk, sans-serif" font-size="13.5" font-weight="400" fill="#8f9bc8" text-anchor="start" opacity="1">by AWS for safe finding generation.</text></svg>
