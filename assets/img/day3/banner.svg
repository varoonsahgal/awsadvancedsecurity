<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
  <title>Walls and Moats: a glowing fortress on floating islands, ringed by energy shields and moats of light</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#020617"/><stop offset=".45" stop-color="#062a2a"/><stop offset=".8" stop-color="#0b3b46"/><stop offset="1" stop-color="#051421"/>
    </linearGradient>
    <radialGradient id="moon" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ecfeff"/><stop offset=".6" stop-color="#a5f3fc" stop-opacity=".6"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="aur1" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#34d399" stop-opacity=".55"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></radialGradient>
    <radialGradient id="aur2" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#22d3ee" stop-opacity=".45"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e3a3a"/><stop offset=".3" stop-color="#0f2a30"/><stop offset="1" stop-color="#030b10"/></linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6ee7b7"/><stop offset="1" stop-color="#047857"/></linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d1fae5"/><stop offset=".35" stop-color="#5eead4"/><stop offset="1" stop-color="#0f766e"/></linearGradient>
    <linearGradient id="wallside" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#99f6e4"/><stop offset="1" stop-color="#115e59"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9900" stop-opacity="0"/><stop offset=".5" stop-color="#ffb347" stop-opacity=".9"/><stop offset="1" stop-color="#ff9900" stop-opacity="0"/></linearGradient>
    <radialGradient id="dome" cx=".5" cy=".7" r=".6"><stop offset="0" stop-color="#34d399" stop-opacity="0"/><stop offset=".8" stop-color="#34d399" stop-opacity=".12"/><stop offset=".97" stop-color="#a7f3d0" stop-opacity=".55"/><stop offset="1" stop-color="#a7f3d0" stop-opacity="0"/></radialGradient>
    <linearGradient id="moat" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient>
    <linearGradient id="tent" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#be185d"/><stop offset="1" stop-color="#4c0519"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="22"/></filter>
    <pattern id="hex" width="40" height="46" patternUnits="userSpaceOnUse">
      <path d="M20 0 L40 11.5 V34.5 L20 46 L0 34.5 V11.5 Z" fill="none" stroke="#6ee7b7" stroke-opacity=".22" stroke-width="1.2"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>
  <!-- aurora -->
  <ellipse cx="420" cy="230" rx="520" ry="170" fill="url(#aur1)" filter="url(#soft)"/>
  <ellipse cx="1200" cy="180" rx="560" ry="150" fill="url(#aur2)" filter="url(#soft)"/>
  <path d="M0 260 C300 120 520 330 820 210 S1300 90 1600 220" stroke="#34d399" stroke-opacity=".35" stroke-width="40" fill="none" filter="url(#soft)"/>
  <!-- stars -->
  <g fill="#ecfeff">
    <circle cx="90" cy="70" r="1.6"/><circle cx="210" cy="140" r="1.1"/><circle cx="330" cy="50" r="1.8"/><circle cx="520" cy="110" r="1.2"/>
    <circle cx="700" cy="40" r="1.5"/><circle cx="860" cy="120" r="1"/><circle cx="1010" cy="60" r="1.7"/><circle cx="1150" cy="130" r="1.2"/>
    <circle cx="1330" cy="70" r="1.6"/><circle cx="1490" cy="150" r="1.1"/><circle cx="1550" cy="40" r="1.4"/><circle cx="40" cy="230" r="1"/>
    <circle cx="620" cy="190" r="1"/><circle cx="1420" cy="260" r="1.3"/><circle cx="160" cy="320" r="1.2"/><circle cx="960" cy="230" r="1"/>
  </g>
  <!-- moon -->
  <circle cx="1310" cy="170" r="120" fill="url(#moon)"/>
  <circle cx="1310" cy="170" r="52" fill="#ecfeff" opacity=".9"/>

  <!-- distant islands -->
  <g opacity=".55">
    <path d="M60 560 Q170 520 280 560 L240 610 Q180 700 150 640 Q110 620 60 560 Z" fill="#0b2a2f"/>
    <path d="M60 560 Q170 520 280 560 Q170 572 60 560 Z" fill="#34d399" opacity=".5"/>
    <path d="M1330 520 Q1440 490 1550 525 L1510 570 Q1460 660 1420 600 Q1370 580 1330 520 Z" fill="#0b2a2f"/>
    <path d="M1330 520 Q1440 490 1550 525 Q1440 537 1330 520 Z" fill="#34d399" opacity=".5"/>
    <rect x="160" y="500" width="22" height="50" fill="#5eead4" opacity=".6"/><rect x="1430" y="460" width="20" height="56" fill="#5eead4" opacity=".6"/>
    <circle cx="171" cy="494" r="6" fill="#ff9900" filter="url(#glow)"/><circle cx="1440" cy="454" r="6" fill="#ff9900" filter="url(#glow)"/>
  </g>

  <!-- bridges of light from distant islands -->
  <path d="M280 560 Q480 600 600 640" stroke="#22d3ee" stroke-width="3" fill="none" stroke-dasharray="10 8" opacity=".7" filter="url(#glow)"/>
  <path d="M1330 525 Q1130 590 1010 640" stroke="#22d3ee" stroke-width="3" fill="none" stroke-dasharray="10 8" opacity=".7" filter="url(#glow)"/>

  <!-- main island -->
  <path d="M430 650 Q800 590 1170 650 L1120 700 Q1040 820 960 840 Q880 990 800 960 Q720 990 650 850 Q560 820 490 720 Z" fill="url(#rock)"/>
  <g stroke="#0d3b3b" stroke-width="3" fill="none" opacity=".8">
    <path d="M560 720 L610 800"/><path d="M720 700 L760 880"/><path d="M880 700 L850 900"/><path d="M1020 710 L980 800"/>
  </g>
  <path d="M430 650 Q800 590 1170 650 Q800 680 430 650 Z" fill="url(#grass)"/>
  <!-- hanging roots / data cables -->
  <g stroke="#34d399" stroke-width="2" fill="none" opacity=".6">
    <path d="M700 900 q-10 40 6 70"/><path d="M800 955 q8 30 -4 40"/><path d="M900 860 q14 40 0 80"/>
  </g>
  <g fill="#22d3ee" filter="url(#glow)"><circle cx="706" cy="970" r="4"/><circle cx="796" cy="995" r="3"/><circle cx="900" cy="940" r="4"/></g>

  <!-- moats of light: concentric ellipses around the fortress -->
  <ellipse cx="800" cy="640" rx="360" ry="46" fill="none" stroke="url(#moat)" stroke-width="6" filter="url(#glow)"/>
  <ellipse cx="800" cy="640" rx="300" ry="36" fill="none" stroke="#34d399" stroke-width="3" opacity=".8" filter="url(#glow)"/>
  <ellipse cx="800" cy="640" rx="250" ry="28" fill="none" stroke="#ff9900" stroke-width="2" stroke-dasharray="14 10" opacity=".9"/>

  <!-- fortress -->
  <g>
    <!-- outer wall -->
    <path d="M590 640 V540 h24 v-18 h20 v18 h24 v-18 h20 v18 h24 v-18 h20 v18 h24 v-18 h20 v18 h24 v-18 h20 v18 h24 v-18 h20 v18 h24 v-18 h20 v18 h24 v-18 h20 v18 h24 v100 Z" fill="url(#wall)"/>
    <rect x="590" y="600" width="420" height="40" fill="#0f766e" opacity=".35"/>
    <!-- gate -->
    <path d="M770 640 V585 a30 30 0 0 1 60 0 V640 Z" fill="#042f2e"/>
    <path d="M770 640 V585 a30 30 0 0 1 60 0 V640" fill="none" stroke="#ff9900" stroke-width="3" filter="url(#glow)"/>
    <g stroke="#34d399" stroke-width="2" opacity=".8"><path d="M785 600 V640 M800 590 V640 M815 600 V640"/></g>
    <!-- side towers -->
    <rect x="560" y="470" width="70" height="170" fill="url(#wallside)"/>
    <path d="M552 470 h86 l-43 -70 Z" fill="#0f766e"/>
    <rect x="970" y="470" width="70" height="170" fill="url(#wallside)"/>
    <path d="M962 470 h86 l-43 -70 Z" fill="#0f766e"/>
    <!-- keep -->
    <rect x="700" y="380" width="200" height="160" fill="url(#wall)"/>
    <path d="M700 380 v-20 h20 v20 h20 v-20 h20 v20 h20 v-20 h20 v20 h20 v-20 h20 v20 h20 v-20 h20 v20 h20 v-20 h20 v20" fill="#99f6e4"/>
    <rect x="760" y="260" width="80" height="120" fill="url(#wallside)"/>
    <path d="M750 260 h100 l-50 -90 Z" fill="#115e59"/>
    <!-- windows -->
    <g fill="#ffcf7a" filter="url(#glow)">
      <rect x="788" y="300" width="24" height="34" rx="12"/>
      <rect x="730" y="420" width="18" height="28" rx="9"/><rect x="852" y="420" width="18" height="28" rx="9"/>
      <rect x="586" y="510" width="16" height="24" rx="8"/><rect x="998" y="510" width="16" height="24" rx="8"/>
    </g>
    <!-- beacon -->
    <rect x="796" y="120" width="8" height="60" fill="url(#beam)"/>
    <circle cx="800" cy="168" r="11" fill="#ff9900" filter="url(#glow)"/>
    <!-- flags -->
    <path d="M595 400 v-40 l30 10 -30 10" fill="#ff9900"/><path d="M1005 400 v-40 l30 10 -30 10" fill="#ff9900"/>
  </g>

  <!-- energy shield dome -->
  <ellipse cx="800" cy="560" rx="400" ry="430" fill="url(#dome)"/>
  <clipPath id="domeclip"><ellipse cx="800" cy="560" rx="398" ry="428"/></clipPath>
  <rect x="400" y="130" width="800" height="510" fill="url(#hex)" clip-path="url(#domeclip)"/>
  <path d="M400 560 A400 430 0 0 1 1200 560" fill="none" stroke="#a7f3d0" stroke-width="3" opacity=".8" filter="url(#glow)"/>

  <!-- kraken tentacles probing the shield -->
  <g opacity=".95">
    <path d="M0 900 C120 820 160 700 300 640 C370 610 420 560 420 520" stroke="url(#tent)" stroke-width="34" fill="none" stroke-linecap="round"/>
    <path d="M1600 880 C1470 800 1440 700 1300 640 C1240 615 1190 570 1180 520" stroke="url(#tent)" stroke-width="30" fill="none" stroke-linecap="round"/>
    <g fill="#fda4af" opacity=".55">
      <circle cx="190" cy="760" r="6"/><circle cx="250" cy="690" r="5"/><circle cx="330" cy="625" r="5"/>
      <circle cx="1420" cy="740" r="6"/><circle cx="1350" cy="670" r="5"/><circle cx="1260" cy="620" r="4"/>
    </g>
    <!-- shield impact sparks -->
    <g filter="url(#glow)">
      <circle cx="420" cy="515" r="16" fill="#a7f3d0" opacity=".9"/><circle cx="1180" cy="515" r="14" fill="#a7f3d0" opacity=".9"/>
      <path d="M420 515 l-40 -20 M420 515 l-30 30 M420 515 l-44 6" stroke="#ecfeff" stroke-width="3"/>
      <path d="M1180 515 l40 -20 M1180 515 l30 30 M1180 515 l44 6" stroke="#ecfeff" stroke-width="3"/>
    </g>
  </g>

  <!-- packets bouncing off -->
  <g font-family="JetBrains Mono, monospace" font-size="18" fill="#fb7185" opacity=".85">
    <text x="210" y="470">DROP tls.sni=c2.kraken</text>
    <text x="1210" y="450">BLOCK *.kraken-c2</text>
    <text x="1240" y="800">429 shields engaged</text>
    <text x="90" y="830">403 sqli</text>
  </g>
  <g font-family="Space Grotesk, Inter, sans-serif" fill="#ecfeff">
    <text x="800" y="76" text-anchor="middle" font-size="22" letter-spacing="10" opacity=".75">DAY 3 · WALLS &amp; MOATS</text>
  </g>
</svg>
