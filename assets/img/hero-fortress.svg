<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900">
  <title>The Skyfortress: a citadel on a floating island, shielded by an energy dome, with a kraken tentacle rising from the clouds below</title>
  <defs>
    <radialGradient id="hsky" cx=".5" cy=".42" r=".6">
      <stop offset="0" stop-color="#2a2370"/><stop offset=".55" stop-color="#121444" stop-opacity=".9"/><stop offset="1" stop-color="#060915" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hdome" cx=".5" cy=".85" r=".75">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset=".75" stop-color="#22d3ee" stop-opacity=".06"/><stop offset=".97" stop-color="#7dd3fc" stop-opacity=".55"/><stop offset="1" stop-color="#e0f2fe" stop-opacity=".9"/>
    </radialGradient>
    <linearGradient id="hrock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b2f86"/><stop offset=".5" stop-color="#1e1650"/><stop offset="1" stop-color="#0b0824"/>
    </linearGradient>
    <linearGradient id="hgrass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="htower" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c7d2fe"/><stop offset=".5" stop-color="#8b9cf6"/><stop offset="1" stop-color="#4c51bf"/>
    </linearGradient>
    <linearGradient id="htower2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a5b4fc"/><stop offset="1" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="hroof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd27a"/><stop offset="1" stop-color="#ff8a00"/>
    </linearGradient>
    <linearGradient id="hbeam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff9900" stop-opacity=".9"/><stop offset="1" stop-color="#ff9900" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hcloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cbd5ff" stop-opacity=".95"/><stop offset="1" stop-color="#6d6fd8" stop-opacity=".6"/>
    </linearGradient>
    <linearGradient id="htent" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#5a0b33"/><stop offset="1" stop-color="#e0336f"/>
    </linearGradient>
    <linearGradient id="hring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0"/><stop offset=".5" stop-color="#f472b6"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <filter id="hglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="hsoft"><feGaussianBlur stdDeviation="18"/></filter>
    <clipPath id="hdomeclip"><path d="M190 520 A310 310 0 0 1 810 520 Z"/></clipPath>
  </defs>

  <circle cx="500" cy="420" r="460" fill="url(#hsky)"/>
  <!-- moon -->
  <circle cx="780" cy="150" r="54" fill="#fde68a" opacity=".9" filter="url(#hglow)"/>
  <circle cx="800" cy="138" r="54" fill="#1a1850" opacity=".85"/>
  <!-- stars -->
  <g fill="#fff">
    <circle cx="120" cy="120" r="2"/><circle cx="220" cy="60" r="1.4"/><circle cx="330" cy="140" r="1.8"/><circle cx="640" cy="70" r="1.6"/>
    <circle cx="900" cy="260" r="2"/><circle cx="80" cy="330" r="1.5"/><circle cx="930" cy="420" r="1.3"/><circle cx="560" cy="40" r="1.2"/>
    <circle cx="440" cy="90" r="1"/><circle cx="700" cy="230" r="1.2"/><circle cx="160" cy="230" r="1.1"/>
  </g>
  <!-- orbit ring back -->
  <ellipse cx="500" cy="420" rx="430" ry="110" fill="none" stroke="url(#hring)" stroke-width="3" opacity=".6" transform="rotate(-12 500 420)"/>

  <!-- island rock -->
  <path d="M230 560 C260 540 740 540 770 560 C760 610 700 640 650 690 C610 740 560 800 500 860 C450 800 400 740 360 700 C300 650 240 610 230 560 Z" fill="url(#hrock)"/>
  <path d="M300 600 L340 680 M420 610 L440 720 M560 615 L540 740 M690 600 L650 670" stroke="#5b4bc4" stroke-width="3" opacity=".5"/>
  <g fill="#22d3ee" filter="url(#hglow)">
    <path d="M410 660 l12 -24 l12 24 l-12 18 z" opacity=".9"/>
    <path d="M590 650 l9 -18 l9 18 l-9 14 z" opacity=".8"/>
    <path d="M500 780 l10 -20 l10 20 l-10 16 z" fill="#f472b6"/>
  </g>
  <!-- roots/vines -->
  <path d="M500 860 C495 880 505 890 500 900" stroke="#5b4bc4" stroke-width="4"/>
  <!-- grass top -->
  <path d="M228 560 C260 530 740 530 772 560 C740 548 260 548 228 560 Z" fill="url(#hgrass)"/>

  <!-- citadel -->
  <g>
    <!-- back towers -->
    <rect x="340" y="400" width="54" height="150" fill="url(#htower2)"/>
    <path d="M334 402 L367 340 L400 402 Z" fill="url(#hroof)"/>
    <rect x="606" y="400" width="54" height="150" fill="url(#htower2)"/>
    <path d="M600 402 L633 340 L666 402 Z" fill="url(#hroof)"/>
    <!-- wall -->
    <rect x="300" y="470" width="400" height="80" fill="url(#htower)"/>
    <g fill="url(#htower)">
      <rect x="300" y="452" width="26" height="20"/><rect x="342" y="452" width="26" height="20"/><rect x="384" y="452" width="26" height="20"/>
      <rect x="590" y="452" width="26" height="20"/><rect x="632" y="452" width="26" height="20"/><rect x="674" y="452" width="26" height="20"/>
    </g>
    <!-- keep -->
    <rect x="440" y="300" width="120" height="250" fill="url(#htower)"/>
    <path d="M428 304 L500 200 L572 304 Z" fill="url(#hroof)"/>
    <rect x="496" y="150" width="8" height="60" fill="#ffd27a"/>
    <path d="M504 152 L548 166 L504 180 Z" fill="#ff9900"/>
    <!-- gate -->
    <path d="M472 550 V500 A28 28 0 0 1 528 500 V550 Z" fill="#141040"/>
    <path d="M472 550 V500 A28 28 0 0 1 528 500 V550" fill="none" stroke="#ffd27a" stroke-width="3"/>
    <!-- windows -->
    <g fill="#ffcf6b" filter="url(#hglow)">
      <rect x="470" y="340" width="16" height="26" rx="8"/><rect x="514" y="340" width="16" height="26" rx="8"/>
      <rect x="492" y="400" width="16" height="26" rx="8"/>
      <rect x="360" y="430" width="12" height="20" rx="6"/><rect x="627" y="430" width="12" height="20" rx="6"/>
    </g>
    <!-- lock emblem -->
    <g transform="translate(500 460)">
      <circle r="22" fill="#141040" stroke="#22d3ee" stroke-width="3"/>
      <rect x="-9" y="-3" width="18" height="14" rx="3" fill="#22d3ee"/>
      <path d="M-6 -3 v-5 a6 6 0 0 1 12 0 v5" stroke="#22d3ee" stroke-width="3" fill="none"/>
    </g>
  </g>

  <!-- searchlight beams -->
  <path d="M367 345 L250 40 L310 30 Z" fill="url(#hbeam)" opacity=".35"/>
  <path d="M633 345 L760 30 L700 20 Z" fill="url(#hbeam)" opacity=".3"/>

  <!-- energy dome -->
  <path d="M190 520 A310 310 0 0 1 810 520" fill="url(#hdome)" stroke="#7dd3fc" stroke-width="2" opacity=".95"/>
  <g clip-path="url(#hdomeclip)" stroke="#7dd3fc" stroke-width="1" fill="none" opacity=".22">
    <path d="M190 470 H810 M190 410 H810 M190 350 H810 M190 290 H810 M190 230 H810"/>
    <path d="M300 520 Q340 300 500 210 M700 520 Q660 300 500 210 M400 520 Q420 300 500 210 M600 520 Q580 300 500 210"/>
  </g>
  <!-- hex sparks on dome -->
  <g fill="#e0f2fe" filter="url(#hglow)">
    <circle cx="262" cy="350" r="4"/><circle cx="740" cy="352" r="4"/><circle cx="500" cy="212" r="5"/><circle cx="360" cy="256" r="3"/><circle cx="650" cy="258" r="3"/>
  </g>

  <!-- orbit ring front -->
  <path d="M80 470 A430 110 -12 0 0 930 300" fill="none" stroke="url(#hring)" stroke-width="3" opacity=".9"/>
  <circle cx="900" cy="320" r="9" fill="#f472b6" filter="url(#hglow)"/>
  <circle cx="150" cy="490" r="6" fill="#22d3ee" filter="url(#hglow)"/>

  <!-- kraken tentacle rising -->
  <path d="M860 900 C860 800 900 740 870 680 C850 640 800 640 800 680 C800 700 820 708 832 696" fill="none" stroke="url(#htent)" stroke-width="34" stroke-linecap="round"/>
  <g fill="#ffb3cb" opacity=".8"><circle cx="855" cy="760" r="5"/><circle cx="866" cy="720" r="4.5"/><circle cx="858" cy="684" r="4"/></g>
  <path d="M120 900 C130 820 90 780 110 740 C125 712 160 720 156 746" fill="none" stroke="url(#htent)" stroke-width="24" stroke-linecap="round" opacity=".85"/>

  <!-- clouds -->
  <g filter="url(#hsoft)" opacity=".55"><ellipse cx="500" cy="820" rx="480" ry="60" fill="#4f46e5"/></g>
  <g fill="url(#hcloud)">
    <path d="M0 840 C40 790 120 800 150 820 C180 780 260 780 290 820 C330 800 380 810 390 850 L390 900 L0 900 Z" opacity=".9"/>
    <path d="M610 850 C640 800 720 800 740 830 C780 790 860 800 880 840 C920 820 980 830 1000 860 L1000 900 L610 900 Z" opacity=".85"/>
    <path d="M300 880 C340 840 420 850 440 870 C480 840 560 845 580 875 C620 860 660 870 670 900 L300 900 Z" opacity=".7"/>
  </g>
  <g fill="#e0e7ff" opacity=".5">
    <ellipse cx="140" cy="200" rx="70" ry="14"/><ellipse cx="860" cy="560" rx="80" ry="14"/><ellipse cx="90" cy="610" rx="60" ry="10"/>
  </g>
</svg>
