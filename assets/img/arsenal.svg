<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="Space Grotesk, Inter, sans-serif">
  <title>The Arsenal: a glowing armoury of security tools floating in the clouds</title>
  <defs>
    <radialGradient id="as" cx=".5" cy=".4" r=".8"><stop offset="0" stop-color="#2b1f6e"/><stop offset=".6" stop-color="#0d1236"/><stop offset="1" stop-color="#060915"/></radialGradient>
    <linearGradient id="ach" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#3b1f8f"/></linearGradient>
    <linearGradient id="agold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#ff9900"/></linearGradient>
    <linearGradient id="abeam" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ffcf6b" stop-opacity=".85"/><stop offset="1" stop-color="#ffcf6b" stop-opacity="0"/></linearGradient>
    <filter id="agl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="asoft"><feGaussianBlur stdDeviation="30"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#as)"/>
  <g fill="#fff" opacity=".7">
    <circle cx="120" cy="100" r="2"/><circle cx="380" cy="60" r="1.5"/><circle cx="1300" cy="120" r="2"/><circle cx="1480" cy="300" r="1.5"/><circle cx="220" cy="380" r="1.3"/><circle cx="1050" cy="70" r="1.2"/><circle cx="700" cy="40" r="1.6"/>
  </g>
  <!-- light beam from chest -->
  <path d="M620 640 L420 0 H1180 L980 640 Z" fill="url(#abeam)" opacity=".35"/>
  <!-- floating tools -->
  <g filter="url(#agl)">
    <!-- key -->
    <g transform="translate(470 300) rotate(-20)"><circle r="38" fill="none" stroke="#a78bfa" stroke-width="12"/><rect x="34" y="-7" width="120" height="14" rx="6" fill="#a78bfa"/><rect x="120" y="0" width="12" height="30" fill="#a78bfa"/><rect x="140" y="0" width="12" height="22" fill="#a78bfa"/></g>
    <!-- magnifier -->
    <g transform="translate(800 200)"><circle r="56" fill="rgba(34,211,238,.15)" stroke="#22d3ee" stroke-width="12"/><rect x="38" y="38" width="22" height="90" rx="10" transform="rotate(-45 38 38)" fill="#22d3ee"/></g>
    <!-- shield -->
    <g transform="translate(1130 300)"><path d="M0 -80 L66 -54 V0 C66 48 32 76 0 90 C-32 76 -66 48 -66 0 V-54 Z" fill="rgba(52,211,153,.2)" stroke="#34d399" stroke-width="10"/><path d="M-26 0 l18 20 l36 -40" stroke="#34d399" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
    <!-- lock -->
    <g transform="translate(330 560)"><rect x="-46" y="-10" width="92" height="74" rx="14" fill="rgba(251,191,36,.2)" stroke="#fbbf24" stroke-width="10"/><path d="M-28 -10 v-26 a28 28 0 0 1 56 0 v26" stroke="#fbbf24" stroke-width="10" fill="none"/></g>
    <!-- terminal -->
    <g transform="translate(1270 560)"><rect x="-80" y="-56" width="160" height="112" rx="14" fill="rgba(251,113,133,.18)" stroke="#fb7185" stroke-width="10"/><path d="M-50 -16 l24 18 l-24 18" stroke="#fb7185" stroke-width="10" fill="none" stroke-linecap="round"/><rect x="-10" y="18" width="50" height="10" rx="5" fill="#fb7185"/></g>
    <!-- scroll -->
    <g transform="translate(600 470) rotate(12)"><rect x="-70" y="-40" width="140" height="80" rx="8" fill="rgba(244,114,182,.18)" stroke="#f472b6" stroke-width="8"/><path d="M-46 -14 h92 M-46 4 h70 M-46 22 h82" stroke="#f472b6" stroke-width="6" stroke-linecap="round"/></g>
    <!-- gear -->
    <g transform="translate(1000 480)"><circle r="40" fill="none" stroke="#60a5fa" stroke-width="16" stroke-dasharray="18 10"/><circle r="16" fill="#60a5fa"/></g>
  </g>
  <!-- chest -->
  <g transform="translate(800 720)">
    <ellipse cx="0" cy="190" rx="360" ry="40" fill="#000" opacity=".4"/>
    <path d="M-260 -20 Q0 -170 260 -20 Z" fill="url(#ach)" transform="rotate(-8 -260 -20)"/>
    <rect x="-260" y="-20" width="520" height="200" rx="20" fill="url(#ach)"/>
    <rect x="-260" y="30" width="520" height="22" fill="url(#agold)"/>
    <rect x="-200" y="-20" width="24" height="200" fill="url(#agold)"/>
    <rect x="176" y="-20" width="24" height="200" fill="url(#agold)"/>
    <rect x="-34" y="18" width="68" height="70" rx="10" fill="url(#agold)"/>
    <circle cx="0" cy="46" r="10" fill="#3b1f8f"/><rect x="-4" y="46" width="8" height="22" fill="#3b1f8f"/>
    <g fill="#ffe08a" filter="url(#agl)"><circle cx="-160" cy="-30" r="8"/><circle cx="120" cy="-46" r="6"/><circle cx="20" cy="-60" r="9"/></g>
  </g>
  <!-- clouds -->
  <g opacity=".6" filter="url(#asoft)"><ellipse cx="800" cy="960" rx="900" ry="90" fill="#4f46e5"/></g>
  <g fill="#c7d2fe" opacity=".55">
    <path d="M0 960 C80 900 200 910 240 940 C300 890 420 900 460 950 L460 1000 L0 1000 Z"/>
    <path d="M1140 960 C1200 900 1320 905 1360 940 C1420 900 1540 910 1600 950 L1600 1000 L1140 1000 Z"/>
  </g>
  <text x="800" y="130" text-anchor="middle" font-size="40" font-weight="700" fill="#fff" opacity=".0">ARSENAL</text>
</svg>
